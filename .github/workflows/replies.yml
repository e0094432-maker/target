name: Marketer replies

# Every half hour the marketer reads new comments under our own posts and answers them.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  id-token: write   # GitHub signs a short token that proves the job is from this repository

concurrency: replies

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API: https://korin-api.onrender.com
    steps:
      - name: Answer new comments
        run: |
          curl -s -m 120 "$API/api/health" || true   # the free server sleeps: wake it first
          for BRAND in korin kenes; do
            OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=korin-api" | node -pe 'JSON.parse(require("fs").readFileSync(0)).value')
            echo "::add-mask::$OIDC"
            OIDC="$OIDC" BRAND="$BRAND" node -e 'console.log(JSON.stringify({oidc:process.env.OIDC, brand:process.env.BRAND}))' > /tmp/ask.json
            echo "--- $BRAND"
            for i in 1 2 3 4; do
              curl -sS -m 240 -X POST -H "Content-Type: application/json" -d @/tmp/ask.json "$API/api/marketer-replies" > /tmp/out.json || true
              node -e 'try{JSON.parse(require("fs").readFileSync("/tmp/out.json"))}catch(e){process.exit(1)}' && break
              echo "server is restarting, waiting"; sleep 30
            done
            cat /tmp/out.json; echo
          done
