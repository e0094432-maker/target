name: Körin marketer

# Every day: the model writes a post and the text for two or three pictures, the pictures are drawn in the Körin style, the post goes to Threads.
on:
  schedule:
    - cron: "40 5 * * *"   # 10:40 in Almaty
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # GitHub signs a short token that proves the job is from this repository

concurrency: marketer

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: https://korin-api.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser
        run: |
          npm install --no-save playwright@1.48.0
          npx playwright install --with-deps chromium
      - name: Write today's post
        run: |
          curl -s -m 120 "$API/api/health" || true   # the free server sleeps: wake it first
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=korin-api" | node -pe 'JSON.parse(require("fs").readFileSync(0)).value')
          echo "::add-mask::$OIDC"
          OIDC="$OIDC" node -e 'console.log(JSON.stringify({oidc:process.env.OIDC}))' > /tmp/key.json
          # the server may be restarting after an update: ask until it answers with a plan
          for i in 1 2 3 4 5 6; do
            curl -sS -m 180 -X POST -H "Content-Type: application/json" -d @/tmp/key.json "$API/api/marketer-plan" > /tmp/plan.json || true
            node -e 'try{const p=JSON.parse(require("fs").readFileSync("/tmp/plan.json")); process.exit(p.slides||p.error?0:1)}catch(e){process.exit(1)}' && break
            echo "server is not ready, waiting"; sleep 30
          done
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/plan.json")); if(!p.slides){console.error(p.error||"no plan"); process.exit(1)} console.log(p.topic+"\n\n"+p.text)'
      - name: Draw the pictures
        id: draw
        run: |
          FILES=$(node social/cards.js /tmp/plan.json korin/media)
          echo "$FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - name: Put the pictures on the site
        run: |
          ls -t korin/media/* | tail -n +46 | xargs -r git rm -q --ignore-unmatch
          git config user.name "korin-marketer"
          git config user.email "marketer@users.noreply.github.com"
          git add korin/media
          git commit -q -m "Marketer pictures"
          git push -q
      - name: Wait until the pictures are live
        run: |
          LAST=$(node -pe 'JSON.parse(process.argv[1]).pop()' '${{ steps.draw.outputs.files }}')
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://kenesai.asia/korin/media/$LAST")" = "200" ] && exit 0
            sleep 15
          done
          echo "pictures did not appear on the site"; exit 1
      - name: Publish to Threads
        run: |
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=korin-api" | node -pe 'JSON.parse(require("fs").readFileSync(0)).value')
          echo "::add-mask::$OIDC"
          OIDC="$OIDC" node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/plan.json")); console.log(JSON.stringify({oidc:process.env.OIDC, text:p.text, images:JSON.parse(process.argv[1]).map(f=>"https://kenesai.asia/korin/media/"+f)}))' '${{ steps.draw.outputs.files }}' > /tmp/pub.json
          # putting the pictures on the site restarts the server; if it answers with a page instead of a result, it has not seen the request yet
          for i in 1 2 3 4 5 6; do
            curl -sS -m 240 -X POST -H "Content-Type: application/json" -d @/tmp/pub.json "$API/api/marketer-publish" > /tmp/result.json || true
            node -e 'try{JSON.parse(require("fs").readFileSync("/tmp/result.json"))}catch(e){process.exit(1)}' && break
            echo "server is restarting, waiting"; sleep 30
          done
          cat /tmp/result.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/result.json")); if(!r.ok){console.error(r.error||"failed"); process.exit(1)}'
