name: Marketer

# Every day, for each brand: the model writes a post and the text for the pictures, the pictures are drawn in the brand's style, the post goes to its Threads account.
on:
  schedule:
    - cron: "40 5 * * *"   # 10:40 in Almaty
  workflow_dispatch:
    inputs:
      brand:
        description: "korin, kenes or both"
        default: both

permissions:
  contents: write
  id-token: write   # GitHub signs a short token that proves the job is from this repository

concurrency: marketer

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API: https://korin-api.onrender.com
      ONLY: ${{ github.event.inputs.brand || 'both' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser
        run: |
          npm install --no-save playwright@1.48.0
          npx playwright install --with-deps chromium
      - name: Write, draw and publish
        run: |
          token() { curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=korin-api" | node -pe 'JSON.parse(require("fs").readFileSync(0)).value'; }
          # the server restarts after every update of the site; a page instead of JSON means it has not seen the request yet
          ask() { for i in 1 2 3 4 5 6 7 8; do
              curl -sS -m 240 -X POST -H "Content-Type: application/json" -d @"$2" "$API$1" > "$3" || true
              node -e 'try{JSON.parse(require("fs").readFileSync(process.argv[1]))}catch(e){process.exit(1)}' "$3" && return 0
              echo "server is restarting, waiting"; sleep 30
            done; return 1; }
          git config user.name "marketer"
          git config user.email "marketer@users.noreply.github.com"
          curl -s -m 120 "$API/api/health" || true
          FAILED=0
          for BRAND in korin kenes; do
            [ "$ONLY" = "both" ] || [ "$ONLY" = "$BRAND" ] || continue
            echo "::group::$BRAND"
            OIDC=$(token); echo "::add-mask::$OIDC"
            OIDC="$OIDC" BRAND="$BRAND" node -e 'console.log(JSON.stringify({oidc:process.env.OIDC, brand:process.env.BRAND}))' > /tmp/ask.json
            ask /api/marketer-plan /tmp/ask.json /tmp/plan.json || { echo "no answer from the server"; FAILED=1; echo "::endgroup::"; continue; }
            if ! node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/plan.json")); if(!p.slides){console.log("skipped: "+(p.error||"no plan")); process.exit(1)} console.log(p.topic+"\n\n"+p.text)'; then
              # an account that is not connected yet is not a failure
              grep -q "ещё не подключён" /tmp/plan.json || FAILED=1
              echo "::endgroup::"; continue
            fi
            FILES=$(node social/cards.js /tmp/plan.json korin/media); echo "$FILES"
            ls -t korin/media/*.png | tail -n +61 | xargs -r git rm -q --ignore-unmatch
            git add korin/media && git commit -q -m "Marketer pictures: $BRAND" && git pull -q --rebase && git push -q
            LAST=$(node -pe 'JSON.parse(process.argv[1]).pop()' "$FILES")
            for i in $(seq 1 40); do [ "$(curl -s -o /dev/null -w '%{http_code}' "https://kenesai.asia/korin/media/$LAST")" = "200" ] && break; sleep 15; done
            OIDC=$(token); echo "::add-mask::$OIDC"
            OIDC="$OIDC" BRAND="$BRAND" node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/plan.json")); console.log(JSON.stringify({oidc:process.env.OIDC, brand:process.env.BRAND, text:p.text, images:JSON.parse(process.argv[1]).map(f=>"https://kenesai.asia/korin/media/"+f)}))' "$FILES" > /tmp/pub.json
            ask /api/marketer-publish /tmp/pub.json /tmp/result.json && cat /tmp/result.json
            node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/result.json")); if(!r.ok){console.error(r.error||"failed"); process.exit(1)}' || FAILED=1
            echo "::endgroup::"
          done
          exit $FAILED
