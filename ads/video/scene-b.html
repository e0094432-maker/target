    glow(fx,SPR.v,fxx,fyy,900*I+200,.55*I);glow(fx,SPR.b,fxx,fyy,520*I+80,.7*I);glow(fx,SPR.w,fxx,fyy,240*(0.3+I),Math.min(1,I*1.3));
    const g=fx.createLinearGradient(fxx-1000,0,fxx+1000,0);g.addColorStop(0,'rgba(111,227,255,0)');g.addColorStop(.5,`rgba(235,245,255,${Ib.toFixed(3)})`);g.addColorStop(1,'rgba(111,227,255,0)');
    fx.fillStyle=g;fx.fillRect(fxx-1000,fyy-3-5*Ib,2000,6+10*Ib);fx.globalAlpha=0.35;fx.fillRect(fxx-1000,fyy-30*Ib,2000,60*Ib);fx.globalAlpha=1;
    for(let k=0;k<14;k++){const an=k/14*TAU+t*0.15+hsh(k)*0.2,len=(300+600*hsh(k+4))*Ib;fx.save();fx.translate(fxx,fyy);fx.rotate(an);const rg=fx.createLinearGradient(0,0,len,0);rg.addColorStop(0,`rgba(200,212,255,${(.45*Ib).toFixed(3)})`);rg.addColorStop(1,'rgba(200,212,255,0)');fx.fillStyle=rg;fx.beginPath();fx.moveTo(0,-4);fx.lineTo(len,0);fx.lineTo(0,4);fx.fill();fx.restore()}
    for(let k=1;k<=5;k++){const gx2=fxx+(-260)*k*0.38,gy2=fyy+620*k*0.38;fx.strokeStyle=`rgba(${k%2?'111,227,255':'139,156,255'},${(.22*Ib).toFixed(3)})`;fx.lineWidth=3;fx.beginPath();fx.arc(gx2,gy2,30+k*22,0,TAU);fx.stroke();glow(fx,k%2?SPR.c:SPR.v,gx2,gy2,40+k*24,.25*Ib)}
    const sk=seg(t,TE,TE+0.75);if(sk>0&&sk<1)ring(fx,fxx,fyy,60+1000*eOutExpo(sk),34,'139,156,255',(1-sk)*.8);
    fx.restore()}
  // send-button ripple
  {const u=seg(t,6.02,6.45);if(u>0&&u<1){fx.save();fx.globalCompositeOperation='lighter';ring(fx,BOX.x+BOX.w-86,BOX.y+BOX.h-76,46+170*eOutExpo(u),16,'139,156,255',1-u);fx.restore()}}
  // flashes
  for(const [t0,pk,dc,rad] of FL){const a=t<t0?pk*eInCubic(seg(t,t0-0.07,t0)):pk*(1-eOutCubic(seg(t,t0+0.03,t0+0.03+dc)));if(a<=0.003)continue;
    fx.save();if(rad){fx.globalCompositeOperation='lighter';const fy=t0===TE?LOGO.y:CY;glow(fx,SPR.w,CX,fy,1500,a);glow(fx,SPR.b,CX,fy,900,a*.6)}else{fx.fillStyle=`rgba(255,255,255,${a.toFixed(3)})`;fx.fillRect(0,0,W,H)}fx.restore()}
  // vignette
  const vg=fx.createRadialGradient(CX,900,420,CX,900,1350);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.62)');fx.fillStyle=vg;fx.fillRect(0,0,W,H);
}

/* ---------- bloom (cheap: quarter-res, squared as a soft threshold) ---------- */
function bloom(amt){
  B0.x.clearRect(0,0,270,480);B0.x.drawImage(cv,0,0,270,480);
  B1.x.globalCompositeOperation='source-over';B1.x.clearRect(0,0,270,480);B1.x.drawImage(B0.c,0,0);B1.x.globalCompositeOperation='multiply';B1.x.drawImage(B0.c,0,0);
  B2.x.clearRect(0,0,270,480);B2.x.filter='blur(4px)';B2.x.drawImage(B1.c,0,0);B2.x.filter='none';
  B3.x.clearRect(0,0,135,240);B3.x.filter='blur(6px)';B3.x.drawImage(B1.c,0,0,135,240);B3.x.filter='none';
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=amt;ctx.drawImage(B2.c,0,0,W,H);ctx.globalAlpha=amt*1.1;ctx.drawImage(B3.c,0,0,W,H);ctx.restore();
}

/* ---------- grain ---------- */
const GR=[];
function buildGrain(){const r=(()=>{let a=12345;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();
  for(let k=0;k<8;k++){const c=document.createElement('canvas');c.width=540;c.height=960;const x=c.getContext('2d'),im=x.createImageData(540,960);
    for(let i=0;i<im.data.length;i+=4){const v=128+(r()+r()+r()-1.5)*70;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);GR.push(c)}}

/* ---------- init ---------- */
function init(){
  for(const L of HOOK){L.size=fit(L.s,L.w,L.size,880);L.lay=lay(L.s,L.w,L.size)}
  ASK.a.size=fit(ASK.a.s,600,ASK.a.size,880);
  for(let i=0;i<=18;i++){QX1[i]=measure(Q1.slice(0,i),500,QS);QX2[i]=measure(Q2.slice(0,i),500,QS)}
  for(const w of WHEEL){WS[w]=fit(w,700,118,860);WW[w]=measure(w,700,WS[w])}
  for(const L of QL){L.size=fit(L.s,L.w,L.size,880);L.wd=words(L.s,L.w,L.size)}
  KL=lay('Körin',700,LOGO.size);
  // particle sources (hook) and targets («Они спрашивают ИИ.»)
  const sample=(fn,step,seed)=>{const o=OFF.x;o.setTransform(1,0,0,1,0,0);o.clearRect(0,0,W,H);fn(o);const d=o.getImageData(0,0,W,H).data,pts=[];
    for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step)if(d[(y*W+x)*4+3]>130)pts.push([x+(hsh(x*31+y*17+seed)-.5)*step*.7,y+(hsh(x*7+y*29+seed)-.5)*step*.7]);return pts};
  const A=sample(c=>hookDraw(c,0,true),5,1),B=sample(c=>{T(c,ASK.a.s,CX,ASK.a.y,{size:ASK.a.size,w:600,col:'#fff'});T(c,ASK.b.s,CX,ASK.b.y,{size:ASK.b.size,w:800,col:'#fff'})},4,2);
  A.forEach((p,i)=>p.k=p[0]+(hsh(i+1)-.5)*70);B.forEach((p,i)=>p.k=p[0]+(hsh(i+2)-.5)*70);A.sort((p,q)=>p.k-q.k);B.sort((p,q)=>p.k-q.k);
  PN=A.length;PA=new Float32Array(PN*2);PR2=new Float32Array(PN);PBt=new Float32Array(PN*2);PR=new Float32Array(PN*4);
  for(let i=0;i<PN;i++){const a=A[i],b=B[Math.floor(i*B.length/PN)];PA[2*i]=a[0];PA[2*i+1]=a[1];PBt[2*i]=b[0];PBt[2*i+1]=b[1];
    PR[4*i]=Math.atan2(a[1]-880,a[0]-CX)+(hsh(i)-.5)*0.9;PR[4*i+1]=110+430*Math.pow(hsh(i+11),1.5);PR2[i]=0.3*clamp(Math.hypot(a[0]-(CX+HOOK[2].lay.w/2+26),a[1]-1095)/1000)+0.03*hsh(i+77);PR[4*i+2]=0.26*(b[0]/W)+0.08*hsh(i+5);PR[4*i+3]=0.9+0.9*hsh(i+3)}
  buildCards();buildGrain();
}

/* ---------- frame ---------- */
window.seek=function(t){
  t=Math.max(0,Math.min(DUR-1e-4,t));
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.filter='none';
  const bg=ctx.createRadialGradient(CX,860,0,CX,860,1300);bg.addColorStop(0,'#0b0d17');bg.addColorStop(1,'#030405');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  fx.setTransform(1,0,0,1,0,0);fx.globalCompositeOperation='source-over';fx.globalAlpha=1;fx.clearRect(0,0,W,H);
  TOPDOT=[];const sh=shake(t);ctx.setTransform(1,0,0,1,sh[0],sh[1]);
  // ambient layers
  let dA=0;
  if(t<T3)dA=1-0.3*seg(t,2.2,3.2);else if(t>=T5-0.1)dA=0.55*seg(t,T5-0.1,T5+0.3)*(1-seg(t,T7,T7+0.3)*0.5)*(1-seg(t,TC,TE))+0.45*seg(t,TE+0.3,TE+1.1);
  ctx.save();cam(1+0.02*Math.sin(t*0.3),0,0,0);dotGrid(t,dA);ctx.restore();
  dust(t,(t>T5?0.7:0)*(1-seg(t,TC,TE))+0.8*seg(t,TE+0.3,TE+1.2),t>TE?50:0);
  meshScene(t);sHook(t);sAsk(t);sPrompt(t);sCards(t);sWheel(t);sQuestion(t);sRings(t);sGauge(t);sSteps(t);sEnd(t);
  ctx.setTransform(1,0,0,1,0,0);
  bloom(0.38);
  overlays(t);
  gx.drawImage(GR[Math.floor(t*30)%8],0,0);
  domCards(t,sh);
};
