      c.strokeStyle = `rgba(160,180,255,${(.5 * (1 - cross)).toFixed(3)})`; c.lineWidth = 2; c.beginPath();
      for (let i = 0; i < n; i += 2) { const [x, y, k] = pp(i, t); if (k > .97) continue; const [px, py] = pp(i, t - .025); c.moveTo(px, py); c.lineTo(x, y) }
      c.stroke();
      c.fillStyle = `rgba(225,232,255,${(.9 * (1 - cross)).toFixed(3)})`;
      for (let i = 0; i < n; i++) { const [x, y, k] = pp(i, t), s = lerp(4, 2.4, k); c.fillRect(x - s / 2, y - s / 2, s, s) }
    }
    if (cross > 0) {
      c.globalCompositeOperation = 'source-over';
      c.save(); c.translate(CX, 660); c.scale(br, br); c.translate(-CX, -660);
      c.shadowColor = 'rgba(139,156,255,.8)'; c.shadowBlur = 50; drawLogo(c, cross); c.restore();
    }
    c.globalCompositeOperation = 'lighter';
    const r = rng(12);
    for (let j = 0; j < 10; j++) {
      const an = j / 10 * 6.2832 + r() * .4, x = CX + Math.cos(an) * (430 + 40 * r()), y = 650 + Math.sin(an) * (150 + 30 * r()), b0 = 18.45 + (j * 3 % 10) * .14 + r() * .1, life = P(t, b0, b0 + .75);
      if (life > 0 && life < 1) sparkle(c, x, y, 8 + 10 * r(), Math.sin(life * Math.PI), t * 2 + j);
    }
  }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; c.filter = 'none';
}
function roundRect(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath() }

const $flash = $('flash');
function flash(t) {
  const f1 = E.outCubic(P(t, 2.52, 2.62)) * (1 - E.outCubic(P(t, 2.64, 3.0)));
  const f2 = E.outCubic(P(t, 17.72, 17.82)) * (1 - E.outCubic(P(t, 17.84, 18.3)));
  const f3 = .22 * (1 - P(t, 5.52, 5.72)) * P(t, 5.5, 5.52);
  const f = Math.max(f1, f2, f3);
  if (f <= .002) { $flash.style.display = 'none'; return }
  $flash.style.display = 'block'; $flash.style.opacity = f.toFixed(3);
}

window.seek = function (t) {
  t = Math.max(0, Math.min(window.DURATION, t));
  drawBG(t);
  sceneS1(t); sceneS2(t); sceneS4(t); sceneS5(t); sceneS7(t); sceneS8(t);
  drawFX(t); flash(t); drawGrain(t);
};
