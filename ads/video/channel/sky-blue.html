<script>
// ======================= beats =======================
const BB = BEATS.beats, BP = BEATS.beat;
const TB = b => { const n = BB.length - 1, i = Math.floor(b); if (i < 0) return BB[0] + b * BP; if (i >= n) return BB[n] + (b - n) * BP; return BB[i] + (BB[i + 1] - BB[i]) * (b - i) };
const BT = t => { const n = BB.length - 1; if (t <= BB[0]) return (t - BB[0]) / BP; if (t >= BB[n]) return n + (t - BB[n]) / BP; let i = 0; while (BB[i + 1] <= t) i++; return i + (t - BB[i]) / (BB[i + 1] - BB[i]) };
const B0 = BB.indexOf(BEATS.downbeats[0]);
const HIT = k => Math.floor(TB(k) * 30) / 30 - 0.025;   // impact time in frames: on the beat or earlier, with margin for MB=4
const T = k => TB(B0 + k), HT = k => HIT(B0 + k);
const BARS = 12;
window.DURATION = TB(B0 + 4 * BARS);
const DUR = window.DURATION;
const DEBUG = /[?&]debug=1/.test(location.search);

// ======================= helpers (from ads/video/scene-a.html) =======================
const W = 1080, H = 1920, CX = 540;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3), inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: (x, c1 = 1.70158) => { const c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) },
};
const spring = (t, t0, f = 34, d = 13) => t < t0 ? 0 : Math.exp(-(t - t0) * d) * Math.sin((t - t0) * f);
const decay = (t, t0, tau) => t < t0 ? 0 : Math.exp(-(t - t0) / tau);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const spd = (f, t) => Math.abs(f(t + 1 / 240) - f(t - 1 / 240)) * 120;
function S(el, o, tr, b, extraFilter) {
  if (o <= 0.002) { if (el._d !== 0) { el.style.display = 'none'; el._d = 0 } return false }
  if (el._d !== 1) { el.style.display = el.dataset.d || 'block'; el._d = 1 }
  el.style.opacity = Math.min(1, o).toFixed(3);
  el.style.transform = tr || 'none';
  const f = (extraFilter || '') + (b > 0.15 ? ` blur(${b.toFixed(2)}px)` : '');
  el.style.filter = f.trim() || 'none';
  return true;
}
const TR = ({ x = 0, y = 0, z = 0, s = 1, sx = 1, sy = 1, rx = 0, ry = 0, rz = 0 } = {}) =>
  `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px) rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg) rotateZ(${rz.toFixed(3)}deg) scale(${(s * sx).toFixed(4)},${(s * sy).toFixed(4)})`;
// word-by-word: each word comes out of blur with scale .9 -> 1 and a lift; ls:false (centred lines)
function words(el, t, tin, tout, opt = {}) {
  const st = opt.st ?? .08, d = opt.d ?? .42, from = opt.from ?? 40, sc = opt.sc ?? .9, bl = opt.bl ?? 22;
  const ws = el._ws || (el._ws = [...el.querySelectorAll('.w')]);
  ws.forEach((w, i) => {
    const a = tin + i * st, k = E.outExpo(P(t, a, a + d)), ko = E.inCubic(P(t, tout + i * .025, tout + i * .025 + .2));
    const o = P(t, a, a + d * .3) * (1 - ko);
    w.style.opacity = o.toFixed(3);
    w.style.transform = `translateY(${((1 - k) * from - ko * 60).toFixed(1)}px) scale(${(lerp(sc, 1, k) * (1 + ko * .1)).toFixed(4)})`;
    const b = (1 - k) * bl + ko * 26;
    w.style.filter = b > .15 ? `blur(${b.toFixed(2)}px)` : 'none';
  });
}
function setMB(id, sx, sy) { const g = $(id + 'g'); const v = `${sx.toFixed(1)} ${sy.toFixed(1)}`; if (g._v !== v) { g.setAttribute('stdDeviation', v); g._v = v } return sx > .4 || sy > .4 ? `url(#${id})` : '' }
const mixW = (rgb, k) => rgb.split(',').map(v => Math.round(lerp(+v, 255, k))).join(',');
const mixC = (a, b, k) => { const A = a.split(',').map(Number), B = b.split(',').map(Number); return A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',') };

// ======================= canvases =======================
const bg = $('bg').getContext('2d'), fx = $('fx').getContext('2d'), tx = $('tx').getContext('2d'), gr = $('grain').getContext('2d');
const grainTiles = [0, 1, 2, 3].map(i => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const im = g.createImageData(256, 256); const r = rng(101 + i * 17); for (let p = 0; p < im.data.length; p += 4) { const v = r() * 255; im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 255 } g.putImageData(im, 0, 0); return c });
function drawGrain(t) {
  const f = Math.floor(t * 30 + 1e-6), r = rng(f * 7 + 3), tile = grainTiles[((f % 4) + 4) % 4];
  const ox = -Math.floor(r() * 256), oy = -Math.floor(r() * 256);
  for (let y = oy; y < H; y += 256) for (let x = ox; x < W; x += 256) gr.drawImage(tile, x, y);
}
function blob(c, x, y, r, rgb, a, sy = 1) {
  if (a <= .001 || r <= 1) return;
  c.save(); c.translate(x, y); c.scale(1, sy);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, `rgba(${rgb},${Math.min(1, a)})`); g.addColorStop(.35, `rgba(${rgb},${Math.min(1, a) * .55})`); g.addColorStop(.7, `rgba(${rgb},${Math.min(1, a) * .15})`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.fillRect(-r, -r, 2 * r, 2 * r); c.restore();
}
function softRing(c, x, y, r, spread, rgb, a) {
  if (a <= .002 || r <= 0) return;
  const r0 = Math.max(0, r - spread), r1 = r + spread;
  const g = c.createRadialGradient(x, y, r0, x, y, r1);
  g.addColorStop(0, `rgba(${rgb},0)`); g.addColorStop(.5, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r1, 0, 6.2832); c.arc(x, y, r0, 0, 6.2832, true); c.fill();
}
function vgrad(c, stops, a = 1, y0 = 0, y1 = H) {
  if (a <= .002) return;
  const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach(([p, col]) => g.addColorStop(p, col));
  c.globalAlpha = Math.min(1, a); c.fillStyle = g; c.fillRect(-400, -600, W + 800, H + 1200); c.globalAlpha = 1;
}
// shockwave ring with a wavy edge
function wavyRing(c, x, y, r, a, rgb, seed) {
  if (a <= .005 || r <= 1) return;
  const N = 120, ph = seed * 1.7, path = new Path2D();
  for (let i = 0; i <= N; i++) { const th = i / N * 6.2832, rr = r * (1 + .024 * Math.sin(th * 7 + ph) + .013 * Math.sin(th * 13 - ph * 2)); const px = x + Math.cos(th) * rr, py = y + Math.sin(th) * rr; i ? path.lineTo(px, py) : path.moveTo(px, py) }
  c.save(); c.filter = 'blur(12px)'; c.lineWidth = Math.max(18, r * .09); c.strokeStyle = `rgba(${rgb},${(.45 * a).toFixed(3)})`; c.stroke(path);
  c.filter = 'none'; c.lineWidth = Math.max(5, r * .018); c.strokeStyle = `rgba(${mixW(rgb, .6)},${(.95 * a).toFixed(3)})`; c.stroke(path); c.restore();
}
// 2 rings, the second 2 frames later; 20% -> 120% of the frame width in 0.25 s
function shock(c, t, t0, x, y, rgb, k = 1) { [[0, 1], [2 / 30, .75]].forEach(([d, m], j) => { const u = P(t, t0 + d, t0 + d + .25); if (u <= 0 || u >= 1) return; wavyRing(c, x, y, lerp(.1, .6, E.outCubic(u)) * W * k, (1 - u) * m, rgb, t0 * 10 + j * 3) }) }
// star glint: 4 thin long rays + soft halo
function star4(c, x, y, L, a, rot, rgb = '255,255,255') {
  if (a <= .01 || L <= 1) return;
  blob(c, x, y, L * .6, rgb, .45 * a); blob(c, x, y, L * .14, '255,255,255', .9 * a);
  c.save(); c.translate(x, y); c.rotate(rot); c.globalAlpha = Math.min(1, a);
  for (let k = 0; k < 4; k++) { c.rotate(Math.PI / 2); const g = c.createLinearGradient(0, 0, L, 0); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.3, `rgba(${rgb},.75)`); g.addColorStop(1, `rgba(${rgb},0)`); c.fillStyle = g; c.beginPath(); c.moveTo(0, -Math.max(3, L * .022)); c.lineTo(L, 0); c.lineTo(0, Math.max(3, L * .022)); c.closePath(); c.fill() }
  c.restore(); c.globalAlpha = 1;
}
// particle sprite: 2 px core + halo, drawn additively
const SPR = {};
function spr(rgb) { if (SPR[rgb]) return SPR[rgb]; const c = document.createElement('canvas'); c.width = c.height = 48; const g = c.getContext('2d'); const q = g.createRadialGradient(24, 24, 0, 24, 24, 24); q.addColorStop(0, 'rgba(255,255,255,1)'); q.addColorStop(.085, 'rgba(255,255,255,1)'); q.addColorStop(.14, `rgba(${rgb},.9)`); q.addColorStop(.4, `rgba(${rgb},.3)`); q.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = q; g.fillRect(0, 0, 48, 48); return SPR[rgb] = c }
function dot(c, x, y, s, rgb, a) { if (a <= .01 || s <= .05) return; c.globalAlpha = Math.min(1, a); const z = 48 * s; c.drawImage(spr(rgb), x - z / 2, y - z / 2, z, z); c.globalAlpha = 1 }

function spark(c, x0, y0, x1, y1, rgb, a, w = 1) {

  if (t >= T(12) && t < T(20)) spots.push({ x: 640, y: 1100, r: 950, rgb: '47,91,255', a: .5 + .35 * pu });
  if (t >= T(34.3) && t < GL1) spots.push({ x: 540, y: 860, r: 760, rgb: mixC('255,110,50', '150,150,170', P(t, T(34.5), T(36))), a: .22 - .08 * P(t, T(34.5), T(36)) });
  if (t >= BLK1 && t < T(41.2)) spots.push({ x: 540, y: 840, r: 1000, rgb: '47,91,255', a: .4 + .3 * pu + .6 * decay(t, H38, .35) });
  if (t >= T(41) && t < BLOOM0) spots.push({ x: 540, y: 980, r: 900, rgb: '47,91,255', a: (.45 + .3 * pu) * (t > T(44.6) ? .6 : 1) });
  ledLayer(c, ox, oy, .05, spots);
  c.setTransform(cam.k, 0, 0, cam.k, cam.bx, cam.by);
  c.globalCompositeOperation = 'lighter';
  for (const s of spots) blob(c, s.x, s.y, s.r * .95, s.rgb, s.a * .55);
  // card under-glow (cards float on a coloured light pool)
  if (t < H4) blob(c, 540, 1200, 520, '47,91,255', .55 * P(t, .2, .5), .3);
  if (t > T(5) && t < T(12)) blob(c, 540, C1.y + C1.h + 10, 420, '255,220,150', .45 * P(t, T(5.3), T(6)), .28);
  drawC1(c, t);
  c.globalCompositeOperation = 'lighter';
  drawC2(c, t);
  c.globalCompositeOperation = 'source-over';
  drawC3(c, t);
  c.globalCompositeOperation = 'source-over';
  drawC4(c, t);
  c.globalCompositeOperation = 'lighter';
  if (t > T(12.3) && t < T(19.4)) blob(c, 540, 790, 520, '47,91,255', .4, .3);
  if (t > T(20.6) && t < T(26.4)) blob(c, 540, 810, 520, '47,91,255', .35 + .3 * flood2(t), .3);
  if (t > T(27.7) && t < T(34.4)) blob(c, 540, 790, 520, '255,110,40', .35 * fade3(t), .3);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; c.filter = 'none';
  // whole-layer motion blur on the big camera moves (fall / rise / crash zoom)
  const vy = Math.abs(spd(camY, t)), zoom = (t > T(11.72) && t < T(12)) || (t > T(19.6) && t < T(20));
  $('bg').style.filter = setMB('mbBG', zoom ? 6 : 0, Math.min(60, vy / 60) + (zoom ? 6 : 0)) || 'none';
}

// ======================= front effects =======================
function drawFX(t, cam) {
  const c = fx; c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.filter = 'none'; c.clearRect(0, 0, W, H);
  if (t >= GL1 && t < BLK1) return;
  c.setTransform(cam.k, 0, 0, cam.k, cam.bx, cam.by); c.globalCompositeOperation = 'lighter';
  // HOOK: star glint charges (shrinks, rays turn 18 deg), sparks to the centre, then the burst
  if (t > T(2.9) && t < H4 + .45) {
    const ch = P(t, T(3), T(3.45)), wu = E.inOutSine(P(t, T(3.55), H4));
    const st = hookState(Math.min(t, H4 - .001)), s = st.s;
    const px = lerp(540, 540 + (945 - 540) * s, 1), py = 870 + (575 - 870) * s;
    if (t < H4) star4(c, px, py, (70 + 40 * ch) * (1 - .55 * wu), ch, .2 + wu * .314, '63,224,200');
    if (t > T(3.6) && t < H4) { const q = P(t, T(3.6), H4); for (let j = 0; j < 12; j++) { const an = j / 12 * 6.2832 + .2, r0 = 560 * (1 - E.inCubic(q)) + 30, r1 = r0 + 110; spark(c, 540 + Math.cos(an) * r1, 870 + Math.sin(an) * r1, 540 + Math.cos(an) * r0, 870 + Math.sin(an) * r0, '160,190,255', .9 * q, .8) } }
  }
  shock(c, t, H4, 540, HCY, '255,226,170');
  if (t > H4 && t < H4 + .5) blob(c, 540, HCY, 700, '255,214,140', .9 * decay(t, H4, .14));
  // spectrum burst glint
  if (t > H8 - .1 && t < H8 + .8) { star4(c, 540, EXITY, 260 * (1 - .4 * P(t, H8 - .1, H8)) + 120 * decay(t, H8, .2), clamp(P(t, H8 - .1, H8) * 1.2) * (1 - P(t, H8 + .4, H8 + .8)), .1 + 3 * P(t, H8 - .1, H8 + .8)); shock(c, t, H8, 540, EXITY, '255,240,200', .55) }
  // HOW1 big scatter: rings from the blue molecule
  if (t > H16 - .05 && t < H16 + .5) { const p = stopPos('b', H16); shock(c, t, H16, p[0], p[1], '120,160,255', .7) }
  // fly-through: the molecule's light fills the frame, then reveals the sky
  const fill = E.inCubic(P(t, T(19.7), T(20))) * (t < T(20) ? 1 : 0) + (t >= T(20) ? 1 - E.outCubic(P(t, T(20), T(20.8))) : 0);
  if (fill > .002) { c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = `rgba(120,160,255,${(.85 * fill).toFixed(3)})`; c.fillRect(0, 0, W, H); blob(c, 540, 960, 1200, '255,255,255', .7 * fill); c.setTransform(cam.k, 0, 0, cam.k, cam.bx, cam.by) }
  if (t > T(19.4) && t < T(20)) { blob(c, MOLB.x, MOLB.y, 260, '120,160,255', .9 * P(t, T(19.4), T(19.6))); blob(c, MOLB.x, MOLB.y, 70, '255,255,255', P(t, T(19.4), T(19.6))) }
  // HOW2 / HOW3 floods: rings
  shock(c, t, H24, OB2.x, OB2.y - 52, '200,220,255');
  shock(c, t, H32, OB3.x, OB3.y - 52, '255,200,150');
  // glitch: RGB-shifted slices for one frame
  if (t >= GL0 && t < GL1) { const r = rng(36); c.setTransform(1, 0, 0, 1, 0, 0); for (let j = 0; j < 9; j++) { const y = 600 + r() * 600, h = 10 + r() * 50; c.fillStyle = j % 3 === 0 ? 'rgba(255,0,70,.5)' : j % 3 === 1 ? 'rgba(0,230,255,.5)' : 'rgba(255,255,255,.35)'; c.fillRect(0, y, W, h) } c.setTransform(cam.k, 0, 0, cam.k, cam.bx, cam.by) }
  drawAnsFX(c, t);
  drawEndFX(c, t);
  c.globalCompositeOperation = 'source-over';
}

// ======================= flash: additive white, 100% for 2 frames, then straight into the next scene's colour ======
const $flash = $('flash');
const flashA = (t, tp) => t < tp - .05 ? 0 : t < tp ? E.inCubic(P(t, tp - .05, tp)) : t < tp + .067 ? 1 : decay(t, tp + .067, .045);
const FLASHES = [[H4, '255,214,140'], [H24, '120,165,255'], [H32, '255,140,60'], [H38, '232,130,111']];
function flash(t) {
  let f = 0, tint = '255,255,255';
  for (const [tp, col] of FLASHES) { const a = flashA(t, tp); if (a > f) { f = a; tint = col } }
  if (f <= .003) { if ($flash._d !== 0) { $flash.style.display = 'none'; $flash._d = 0 } return }
  if ($flash._d !== 1) { $flash.style.display = 'block'; $flash._d = 1 }
  const q = f >= .999 ? 0 : 1 - f, c0 = mixC('255,255,255', tint, q).split(',').map(v => Math.round(v * f)).join(','), c1 = mixC('255,255,255', tint, Math.min(1, q * 1.6)).split(',').map(v => Math.round(v * f * f)).join(',');
  $flash.style.opacity = '1';
  $flash.style.background = `radial-gradient(ellipse at 50% 47%,rgb(${c0}) 0%,rgb(${c1}) 100%)`;
}

// ======================= cues (from beats, computed once) =======================
const CUES = [];
const cue = (t, type, dur) => CUES.push(dur ? { t: +t.toFixed(4), type, dur: +dur.toFixed(4) } : { t: +t.toFixed(4), type });
cue(T(0), 'whoosh', .4);
cue(T(1), 'tick'); cue(T(2), 'tick'); cue(T(3), 'tick');
cue(T(3.5), 'riser', T(4) - T(3.5) - .03);
cue(T(4), 'hit');
cue(T(5), 'whoosh', .3); cue(T(5.5), 'whoosh', .25); cue(T(6), 'tick'); cue(T(6.5), 'tick'); cue(T(7), 'tick');
cue(T(8), 'hit'); cue(T(9), 'tick'); cue(T(10), 'tick'); cue(T(11), 'tick');
cue(T(11.5), 'whoosh', .25);
cue(T(12.5), 'whoosh', .25); cue(T(13), 'tick'); cue(T(13.5), 'tick'); cue(T(14), 'tick'); cue(T(14.5), 'tick'); cue(T(15), 'tick'); cue(T(15.5), 'tick');
cue(T(16), 'hit'); cue(T(17), 'tick'); cue(T(17.5), 'tick'); cue(T(18), 'tick'); cue(T(18.5), 'tick');
cue(T(19), 'whoosh', .25); cue(T(19.5), 'whoosh', .4);
cue(T(20.5), 'whoosh', .3); for (let j = 0; j < 7; j++) cue(T(21 + .5 * j), 'tick');
cue(T(24), 'hit'); cue(T(25), 'tick'); cue(T(26), 'tick');
cue(T(26.5), 'whoosh', .4); cue(T(27.5), 'whoosh', .3);
cue(T(28), 'tick'); cue(T(28.5), 'whoosh', .4); cue(T(29.5), 'whoosh', .3); cue(T(30), 'tick'); cue(T(30.5), 'tick'); cue(T(31), 'tick'); cue(T(31.5), 'tick');
cue(T(32), 'hit');
cue(T(32.5), 'riser', T(34.5) - T(32.5));
cue(T(33.5), 'tick'); cue(T(34), 'tick');
cue(T(34.5), 'breath_on'); cue(T(35), 'tick'); cue(T(35.5), 'tick'); cue(T(36), 'breath_off');
cue(T(36) - .12, 'gap', .12);
cue(T(36), 'subdrop');
cue(T(36.5), 'tick'); cue(T(37), 'tick'); cue(T(37.5), 'tick');
cue(T(38), 'hit'); cue(T(39), 'tick'); cue(T(40), 'tick');
cue(T(40.5), 'whoosh', .3); cue(T(41), 'tick'); cue(T(41.5), 'tick'); cue(T(42), 'tick'); cue(T(43), 'tick');
cue(T(43.75), 'whoosh', .35); cue(T(45), 'tick'); cue(T(46), 'tick'); cue(T(47), 'tick');
cue(BLOOM0 - .05, 'whoosh', .2);
// windows where text may leave the zones (fast exits / zooms)
cue(H4 - .17, 'free', .3); cue(T(11.6), 'free', T(12.3) - T(11.6)); cue(T(19), 'free', T(19.5) - T(19));
cue(T(20.55), 'free', T(20.95) - T(20.55)); cue(T(26.35), 'free', T(27.2) - T(26.35));
cue(T(40.7), 'free', T(41.6) - T(40.7)); cue(T(43.95), 'free', T(45.1) - T(43.95)); cue(BLOOM0, 'free', LOOP0 - BLOOM0);
window.CUES = CUES.sort((a, b) => a.t - b.t);
window.TEXTBOX = [];
window.FONT_WEIGHTS = ['500', '600', '700', '800'];

// ======================= seek =======================
let C1B = [];
window.seek = function (tn) {
  tn = Math.max(0, Math.min(DUR, tn));
  const t = tn >= LOOP0 ? 0 : tn;   // last frames: exactly frame 0 (same function, grain, camera)
  const cam = camera(t);
  $('cam').style.transform = `matrix(${cam.k.toFixed(5)},0,0,${cam.k.toFixed(5)},${cam.bx.toFixed(2)},${cam.by.toFixed(2)})`;
  const black = t >= GL1 && t < BLK1;
  $('root').style.background = black ? '#000' : '#0A0A0E';
  drawBG(t, cam);
  sceneHook(t); sceneC1(t); sceneC2(t); sceneC3(t); sceneC4(t); sceneType(t); sceneAns2(t); sceneEnd(t);
  drawFX(t, cam);
  tx.setTransform(1, 0, 0, 1, 0, 0); tx.globalCompositeOperation = 'source-over'; tx.clearRect(0, 0, W, H);
  drawAnswer(tx, t, cam);
  flash(t);
  $('grain').style.display = black ? 'none' : 'block'; $('vig').style.display = black ? 'none' : 'block';
  if (!black) drawGrain(t);
  if (DEBUG) {
    const b = BT(tn), k = Math.floor(b + 1e-6), on = tn - TB(k) < .1;
    const d = $('dbg'); d.style.display = 'block'; d.textContent = `beat ${k - B0}  ${tn.toFixed(2)}s`;
    d.style.background = on ? ((k - B0) % 4 === 0 ? '#ff5a1f' : '#ffffff') : 'rgba(255,255,255,.35)';
    tx.fillStyle = on ? ((k - B0) % 4 === 0 ? '#ff5a1f' : '#fff') : 'rgba(0,0,0,0)'; tx.fillRect(1000, 30, 50, 50);
  }
};

// ======================= boot: fonts first (no try/catch: a missing font must fail) =======================
function build() {
  // «все цвета» split into letters
  const c1b = $('c1b'); c1b.innerHTML = [...'все цвета'].map(ch => `<span class="ch">${ch === ' ' ? '&nbsp;' : ch}</span>`).join(''); C1B = [...c1b.children];
  // answer word: fit the width, measure every letter (box without glow)
  const m = document.createElement('canvas').getContext('2d');
  m.font = `800 ${AFS}px Onest`; let tw = m.measureText(ANS).width;
  AFS = Math.min(176, Math.floor(AFS * 800 / tw)); m.font = `800 ${AFS}px Onest`; tw = m.measureText(ANS).width;
  const x0 = 540 - tw / 2;
  AX = [...ANS].map((_, i) => x0 + m.measureText(ANS.slice(0, i)).width);
  AW = [...ANS].map((ch, i) => (i < ANS.length - 1 ? AX[i + 1] : x0 + tw) - AX[i]);
  ABOX = [...ANS].map((ch, i) => { const q = m.measureText(ch); return { x0: AX[i] - q.actualBoundingBoxLeft, x1: AX[i] + q.actualBoundingBoxRight, y0: ABASE - q.actualBoundingBoxAscent, y1: ABASE + q.actualBoundingBoxDescent } });
}
(async () => {
  const STR = 'Почему небо синее, а закат оранжевый? Белый свет — все цвета Воздух рассеивает синий сильнее Синий летит к нам отовсюду На закате путь света длиннее Всё дело в… РАССЕЯНИЕ света в воздухе Источник: NASA Подпишись — будет ещё beat 0123456789.s';
  for (const w of window.FONT_WEIGHTS) {
    const r = await document.fonts.load(`${w} 120px Onest`, STR);
    if (!r.length) throw new Error('Onest ' + w + ' did not load');
  }
  await document.fonts.ready;
  for (const w of window.FONT_WEIGHTS) {
    const face = [...document.fonts].some(f => /Onest/.test(f.family) && String(f.weight) === String(w) && f.status === 'loaded');
    if (!face || !document.fonts.check(`${w} 120px Onest`, STR)) throw new Error('Onest ' + w + ' is not ready');
  }
  build();
  window.seek(0);
  window.READY = true;
})();
