<!doctype html><html lang="ru"><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Onest:wght@500;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:1200px;background:#ffc800;color:#0d0d0c;font-family:Onest,sans-serif;overflow:hidden;position:relative}
.sun{position:absolute;right:-330px;top:-330px;width:900px;height:900px;border-radius:50%;background:repeating-conic-gradient(#0d0d0c 0 4.5deg,transparent 4.5deg 11.25deg);-webkit-mask:radial-gradient(circle,transparent 0 37%,#000 37.5% 69%,transparent 69.5%);opacity:.1}
.in{position:absolute;inset:0;padding:84px 78px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:16px;font:900 34px Unbounded;letter-spacing:-.04em}
h1{font:900 86px/1.12 Unbounded;letter-spacing:-.045em;margin-top:64px}
h1 span{background:#0d0d0c;color:#ffc800;padding:0 .14em;border-radius:.12em;display:inline-block;white-space:nowrap;margin-top:.08em}
.card{margin-top:auto;background:#fff;border:4px solid #0d0d0c;border-radius:40px;box-shadow:14px 14px 0 #0d0d0c;padding:34px;transform:rotate(-2deg);width:900px}
.q{background:#0d0d0c;color:#fff;border-radius:28px 28px 8px 28px;padding:20px 28px;font-size:34px;font-weight:500;width:fit-content;margin-left:auto}
.ad{margin-top:22px;background:#ffc800;border:4px solid #0d0d0c;border-radius:28px;padding:24px 28px;display:flex;gap:22px;align-items:center}
.ad i{width:84px;height:84px;border-radius:20px;background:#0d0d0c;flex:none}
.ad small{font:700 20px "JetBrains Mono";letter-spacing:.08em;display:block}
.ad b{font-size:36px;line-height:1.15}
</style>
<div class="sun"></div>
<div class="in">
  <div class="logo"><svg width="60" height="60" viewBox="0 0 32 32" fill="none"><path d="M3 9a6 6 0 0 1 6-6h14a6 6 0 0 1 6 6v9a6 6 0 0 1-6 6h-8l-7 5.500V24a6 6 0 0 1-5-6V9Z" fill="#0d0d0c"/><path d="M12.500 8.500v10M12.500 13.500l6.500-5M12.500 13.500l6.500 5" stroke="#ffc800" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg>KENES AI</div>
  <h1>Клиент спросил ИИ. <span>Под ответом — вы</span></h1>
  <div class="card">
    <div class="q">Посоветуй курсы английского в Алматы</div>
    <div class="ad"><i></i><div><small>РЕКЛАМА</small><b>Ваш бизнес — здесь</b></div></div>
  </div>
</div>
</html>
