<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Körin — помощник маркетолога</title>
<meta name="description" content="Körin: чат, который проверяет, называют ли нейросети ваш бизнес, читает сайт и пишет тексты для маркетинга.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("korin-theme-v4")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Тёмный, как korin/index.html: чёрный фон, панели #0b0b0c, линии #1f1f22, текст #edf2f5, белая главная кнопка,
   мягкий голубой акцент #8b9cff, шрифт Onest. Светлая тема — по кнопке, ключ тот же, что у сайта (korin-theme-v4). */
:root{
  --bg:#000;--side:#060607;--card:#0b0b0c;--sub:#141416;--hover:#18181b;--on:#1d1d20;--line:#1f1f22;--line2:#2c2c30;
  --ink:#f3f6f8;--text:#d4d7dc;--muted:#9a9ca3;--dim:#6c6e75;
  --acc:#8b9cff;--acc-bg:rgba(139,156,255,.12);--acc-line:rgba(139,156,255,.32);--acc-ink:#c9d1ff;
  --pri:#fff;--pri-ink:#111113;--pri-h:#e4e7ea;--off:#232326;--off-ink:#5d5f66;
  --ok:#7ee0a8;--ok-bg:rgba(60,200,130,.13);--bad:#ff9d93;--bad-bg:rgba(255,107,94,.11);--bad-line:rgba(255,107,94,.3);--bad-ink:#ffc9c3;
  --warn:#f2cc7a;--warn-bg:rgba(242,190,80,.1);--warn-line:rgba(242,190,80,.28);--warn-ink:#f3dcab;
  --ring:rgba(139,156,255,.16);--scrim:rgba(0,0,0,.62);--sh:0 0 0 1px rgba(255,255,255,.02);--pop:0 30px 80px -20px rgba(0,0,0,.9);
  --glow:radial-gradient(48% 42% at 78% 0,rgba(139,156,255,.10),transparent 70%);
  --sans:"Onest","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --side-w:264px;--panel-w:min(500px,40vw);color-scheme:dark
}
[data-theme=light]{
  --bg:#fff;--side:#f7f7f8;--card:#fff;--sub:#f4f4f6;--hover:#efeff2;--on:#e9e9ee;--line:#ececef;--line2:#dfdfe4;
  --ink:#14161b;--text:#2b2f36;--muted:#6b7079;--dim:#9a9ea6;
  --acc:#2563eb;--acc-bg:#eef2ff;--acc-line:#d6defe;--acc-ink:#1d4ed8;
  --pri:#2563eb;--pri-ink:#fff;--pri-h:#1d4ed8;--off:#e4e6eb;--off-ink:#a3a7b0;
  --ok:#15803d;--ok-bg:#ecfdf3;--bad:#c2410c;--bad-bg:#fff4ed;--bad-line:#fed7aa;--bad-ink:#7c2d12;
  --warn:#a16207;--warn-bg:#fefce8;--warn-line:#fde68a;--warn-ink:#713f12;
  --ring:rgba(37,99,235,.1);--scrim:rgba(20,22,27,.35);--sh:0 1px 2px rgba(16,24,40,.04),0 6px 24px rgba(16,24,40,.06);--pop:0 20px 60px rgba(16,24,40,.18);
  --glow:none;color-scheme:light
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{color:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
a{color:var(--acc)}
::selection{background:var(--acc-bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:3px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) 0;height:100dvh;transition:grid-template-columns .25s ease}
.app.panel-open{grid-template-columns:var(--side-w) minmax(0,1fr) var(--panel-w)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;background:var(--glow),var(--bg)}
.panel{border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:600;font-size:17px;letter-spacing:-.02em;color:var(--ink)}
.brand a{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.mark{width:24px;height:24px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.mark i{width:8px;height:8px;border-radius:50%;background:var(--bg);display:block}
[data-theme=light] .mark{background:var(--acc)}[data-theme=light] .mark i{background:#fff}
.brand small{font-weight:500;font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:0 7px;letter-spacing:0;margin-left:-2px;line-height:18px}
.side-new{margin:6px 12px 8px;display:flex;align-items:center;gap:9px;height:38px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-weight:500;font-size:14px;color:var(--ink);transition:border-color .15s,background .15s}
.side-new:hover{border-color:var(--dim);background:var(--sub)}
.side-scroll{flex:1;overflow:auto;padding:4px 8px 8px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:16px 9px 5px;font:400 11.5px var(--mono);letter-spacing:.02em;color:var(--dim)}
.sec button{color:var(--muted);width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.sec button:hover{background:var(--hover);color:var(--ink)}
.item{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:7px 9px;border-radius:9px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s,color .12s}
.item span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.item:hover{background:var(--hover);color:var(--ink)}
.item.on{background:var(--on);color:var(--ink);font-weight:500}
.item .cnt{margin-left:auto;font-size:11px;color:var(--ok);flex:none}
.co-dot{width:22px;height:22px;border-radius:7px;background:var(--sub);border:1px solid var(--line2);color:var(--ink);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.empty-note{font-size:13px;color:var(--dim);padding:4px 9px 6px;line-height:1.45}
.side-foot{border-top:1px solid var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px}
.foot-row{display:flex;align-items:center;gap:8px}
.lang{display:inline-flex;background:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{font-size:12.5px;font-weight:500;padding:3px 11px;border-radius:999px;color:var(--muted)}
.lang button.on{background:var(--on);color:var(--ink)}
[data-theme=light] .lang button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.theme{margin-left:auto;width:30px;height:30px;border-radius:999px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted)}
.theme:hover{color:var(--ink);border-color:var(--dim)}
.theme svg.i{width:15px;height:15px}
.srv{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.srv button{color:var(--acc);font-size:12.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.14)}
.dot.down{background:#ff8a5c;box-shadow:0 0 0 3px rgba(255,138,92,.15)}
.dot.wait{background:var(--acc);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- top bar (mobile) / header ---------- */
.top{display:none;align-items:center;gap:6px;height:52px;padding:0 8px;border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.top .ttl{flex:1;text-align:center;font-weight:500;font-size:15px;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.head{display:flex;align-items:center;gap:10px;height:52px;padding:0 20px;flex:none;border-bottom:1px solid transparent}
.head .ttl{font-weight:500;font-size:14.5px;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---------- start screen ---------- */
.view{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 40px}
.start-in{width:100%;max-width:680px}
.hello{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:28px;text-align:center}
.hello .mark{width:30px;height:30px}
.hello .mark i{width:10px;height:10px}
.hello h1{font-size:32px;font-weight:500;letter-spacing:-.035em;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:13.5px;color:var(--text);font-weight:500;white-space:nowrap;transition:border-color .15s,background .15s,color .15s}
.chip:hover{border-color:var(--dim);background:var(--sub);color:var(--ink)}
.chip svg.i{width:16px;height:16px;color:var(--dim)}
.chip:hover svg.i{color:var(--ink)}
.foot-note{margin-top:24px;text-align:center;font-size:12.5px;color:var(--dim);line-height:1.6}
.foot-note button{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;font-size:12.5px}
.foot-note button:hover{color:var(--ink)}

/* ---------- composer ---------- */
.composer{background:var(--card);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--sh);padding:12px 12px 10px 16px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--dim);box-shadow:0 0 0 4px var(--ring)}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:15.5px;line-height:1.5;min-height:26px;max-height:200px;padding:2px 0;color:var(--ink)}
.composer textarea::placeholder{color:var(--dim)}
.c-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.c-ctx{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden}
.ctx{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:28px;padding:0 11px;border-radius:999px;background:var(--sub);border:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx:hover{color:var(--ink);border-color:var(--line2)}
.ctx svg.i{width:14px;height:14px}
.send{width:34px;height:34px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;flex:none;transition:background .15s,opacity .15s}
.send:hover{background:var(--pri-h)}
.send:disabled{background:var(--off);color:var(--off-ink)}
.send svg.i{width:17px;height:17px;stroke-width:2.1}
.dock{flex:none;padding:8px 20px 14px;background:linear-gradient(to bottom,transparent,var(--bg) 18px)}
.dock-in{max-width:740px;margin:0 auto}
.disclaimer{text-align:center;font-size:11.5px;color:var(--dim);margin-top:7px}

/* ---------- conversation ---------- */
.conv{max-width:740px;width:100%;margin:0 auto;padding:18px 20px 10px;display:flex;flex-direction:column;gap:24px}
.msg-u{align-self:flex-end;max-width:82%;background:var(--on);border-radius:18px 18px 5px 18px;padding:10px 15px;color:var(--ink);white-space:pre-wrap;word-wrap:break-word}
.msg-a{display:flex;gap:12px;align-items:flex-start}
.msg-a>.mark{margin-top:3px;width:22px;height:22px}
.msg-a>.mark i{width:7px;height:7px}
.msg-a .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.prose{color:var(--text);word-wrap:break-word}
.prose p+p{margin-top:8px}
.prose b,.prose strong{color:var(--ink);font-weight:600}
.prose a{color:var(--acc-ink)}
.steps{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.steps summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none}
.steps summary::-webkit-details-marker{display:none}
.steps summary .chev{margin-left:auto;transition:transform .2s}
.steps[open] summary .chev{transform:rotate(180deg)}
.steps ol{list-style:none;margin:0;padding:2px 12px 10px;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line)}
.steps li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--text);padding-top:7px;line-height:1.45}
.st-ic{width:18px;height:18px;flex:none;display:grid;place-items:center;margin-top:1px}
.st-ic svg.i{width:15px;height:15px;stroke-width:2.2}
.st-ok{color:var(--ok)}.st-no{color:var(--bad)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--acc);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.label{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font:400 11.5px/1.4 var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:3px 10px}
.label .dot{width:6px;height:6px;box-shadow:none}
.label.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.art-card{display:flex;align-items:center;gap:12px;text-align:left;width:100%;max-width:440px;border:1px solid var(--line2);border-radius:16px;background:var(--card);padding:12px 14px;transition:border-color .15s,background .15s}
.art-card:hover{border-color:var(--dim);background:var(--sub)}
.art-card .ai{width:38px;height:38px;border-radius:11px;background:var(--sub);border:1px solid var(--line2);color:var(--ink);display:grid;place-items:center;flex:none}
.art-card .at{font-weight:500;color:var(--ink);font-size:14px;line-height:1.3}
.art-card .as{font-size:12.5px;color:var(--muted);margin-top:2px}
.art-card .go{margin-left:auto;color:var(--dim)}
.next{display:flex;flex-wrap:wrap;gap:7px}
.next .chip{height:32px;font-size:13px;padding:0 12px}
.err{border:1px solid var(--bad-line);background:var(--bad-bg);border-radius:14px;padding:11px 14px;font-size:14px;color:var(--bad-ink)}
.err .row{display:flex;gap:8px;margin-top:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--sub);border-color:var(--dim)}
.btn-p{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn-p:hover:not(:disabled){background:var(--pri-h);border-color:var(--pri-h)}
.btn:disabled{color:var(--off-ink);background:transparent;border-color:var(--line)}
.btn-p:disabled{background:var(--off);border-color:var(--off)}
.btn svg.i{width:16px;height:16px}
.btn-q{border-color:transparent;background:transparent;color:var(--muted)}
.btn-q:hover:not(:disabled){color:var(--bad);background:var(--bad-bg);border-color:transparent}
.soon{font-size:10.5px;font-weight:500;letter-spacing:.02em;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:0 7px;line-height:17px;white-space:nowrap}
.ex{display:inline-flex;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:0 6px}
.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

/* ---------- artifact panel ---------- */
.p-head{display:flex;align-items:center;gap:10px;height:56px;padding:0 10px 0 20px;border-bottom:1px solid var(--line);flex:none}
.p-head .pt{flex:1;min-width:0}
.p-head h2{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-head .ps{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-body{flex:1;overflow:auto;padding:20px}
.p-foot{flex:none;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card)}
.p-foot .acts{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0}
.p-foot .acts::-webkit-scrollbar{display:none}
.p-foot .acts .btn{flex:none}
.p-foot .hint{flex-basis:100%;font-size:12px;color:var(--dim);line-height:1.5}
.p-foot .hint a{color:var(--acc-ink)}
.stat{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:4px}
.stat b{white-space:nowrap;font-size:44px;font-weight:500;letter-spacing:-.045em;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.bar{height:5px;background:var(--on);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.p-sec{margin-top:24px}
.p-sec>h3{font:400 11.5px var(--mono);letter-spacing:.02em;color:var(--dim);margin-bottom:10px}
.qa{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg)}
[data-theme=light] .qa{background:var(--card)}
.qa+.qa{margin-top:10px}
.qa .q{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.qa .q b{font-weight:500;color:var(--ink);font-size:14px;line-height:1.4}
.qa .a{margin-top:8px;font-size:13.5px;color:var(--muted);line-height:1.6;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.qa.full .a{display:block}
.qa .more{margin-top:6px;font-size:12.5px;color:var(--acc)}
.qa .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--sub);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.no{background:var(--bad-bg);color:var(--bad)}.tag.unk{background:var(--warn-bg);color:var(--warn)}
.chk{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .ci{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.chk .ci.ok{background:var(--ok-bg);color:var(--ok)}.chk .ci.no{background:var(--bad-bg);color:var(--bad)}.chk .ci.unk{background:var(--warn-bg);color:var(--warn)}
.chk .ci svg.i{width:13px;height:13px;stroke-width:2.6}
.chk .cl{font-size:14px;color:var(--ink);font-weight:500;line-height:1.4}
.chk .cd{font-size:12.5px;color:var(--muted);margin-top:1px}
.draft{width:100%;min-height:280px;border:1px solid var(--line2);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.65;resize:vertical;outline:0;background:var(--bg);color:var(--ink)}
[data-theme=light] .draft{background:var(--card)}
.draft:focus{border-color:var(--dim);box-shadow:0 0 0 4px var(--ring)}

.lg{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;letter-spacing:-.02em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

dialog{border:1px solid var(--line2);border-radius:20px;padding:0;width:min(460px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;box-shadow:var(--pop);color:var(--text);background:var(--card)}

let S = load();
const t = k => (T[S.lang] || T.ru)[k] ?? T.ru[k];

/* ---------- хранилище ---------- */
function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)) } catch (e) {}
  if (!s || typeof s !== 'object') s = {};
  return { lang: s.lang === 'kk' ? 'kk' : 'ru', companies: Array.isArray(s.companies) ? s.companies : [], chats: Array.isArray(s.chats) ? s.chats : [], co: s.co || null, chat: s.chat || null };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) {} }

/* ---------- ключи подключений: только этот браузер, отдельный ключ, «Отключить» стирает его ---------- */
const CONN_KEY = 'korin-conn-v1';
function loadConn(){ try { const c = JSON.parse(localStorage.getItem(CONN_KEY)); return c && typeof c === 'object' ? c : {} } catch (e) { return {} } }
let CN = loadConn();
function saveConn(){ try { if (Object.keys(CN).length) localStorage.setItem(CONN_KEY, JSON.stringify(CN)); else localStorage.removeItem(CONN_KEY) } catch (e) {} }
const SVC = { tg: 'Telegram', wp: 'WordPress' };

/* ---------- состояние экрана ---------- */
const UI = { view: 'chat', art: null, menu: false, srv: 'wait', provider: '', ai: true, busy: false, openSteps: new Set() };
const co = () => S.companies.find(c => c.id === S.co) || null;
const chat = () => S.chats.find(c => c.id === S.chat) || null;
const ENGINE = { gemini: 'Gemini', openai: 'ChatGPT' };
const engName = e => ENGINE[e] || (e ? String(e) : '');

/* ---------- сервер ---------- */
class ApiError extends Error { constructor(msg, down){ super(msg); this.down = down } }
async function call(path, body, ms = 120000){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
  let r;
  try { r = await fetch(API + path, { method: body ? 'POST' : 'GET', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal }) }
  catch (e) { setSrv('down'); throw new ApiError(t('down'), true) }
  finally { clearTimeout(timer) }
  let d = null;
  try { d = await r.json() } catch (e) {}
  if (!r.ok) { if (r.status >= 502 && r.status !== 503) { setSrv('down'); throw new ApiError(t('down'), true) } throw new ApiError((d && d.error) || `Сервер ответил кодом ${r.status}.`, false) }
  setSrv('ok');
  return d || {};
}
function setSrv(s){ if (UI.srv !== s) { UI.srv = s; renderSide() } }
async function ping(){
  UI.srv = 'wait'; renderSide();
  try { const d = await call('/api/health', null, 75000); UI.provider = d.provider || ''; UI.ai = !!d.ai; setSrv('ok'); renderSide() } catch (e) {}
}

/* ---------- понимание запроса ---------- */
const CITIES = ['Алматы', 'Астана', 'Шымкент', 'Караганда', 'Актобе', 'Тараз', 'Павлодар', 'Усть-Каменогорск', 'Семей', 'Атырау', 'Костанай', 'Кызылорда', 'Уральск', 'Петропавловск', 'Актау', 'Туркестан'];
const URL_RE = /\b((?:https?:\/\/)?(?:[a-z0-9Ѐ-ӿ-]+\.)+(?:kz|қаз|com|ru|net|org|shop|site|store|online|io|me|info|biz|pro|app|asia|uz|kg)(?:\/[^\s]*)?)/i;
function intentOf(text){
  const s = text.toLowerCase();
  if (/telegram|телеграм|пост (для|в) канал|арнаға/.test(s)) return 'tgpost';
  if (/конкурент|бәсекелес|почему (их|не нас|называют)|неге/.test(s)) return 'why';
  if (/faq|вопрос[а-я]* и ответ|страниц[а-я]* вопрос|сұрақ/.test(s)) return 'faq';
  if (/отзыв|пікір/.test(s)) return 'review';
  if (/instagram|инстаграм|инста|\bbio\b|био|описани[ея] профил|профил/.test(s)) return 'bio';
  if (/замер|видимост|называ|назыв|упомина|chatgpt|gemini|нейросет|атай/.test(s)) return 'measure';
  if (/сайт|robots|аудит|seo|сео/.test(s) || URL_RE.test(s)) return 'audit';
  return 'chat';
}
const NEEDS = { measure: ['name', 'niche', 'city'], audit: ['site'], faq: ['name', 'niche', 'city'], review: ['name', 'niche', 'city'], bio: ['name', 'niche', 'city'], tgpost: ['name', 'niche', 'city'], why: ['name', 'niche', 'city'], chat: [] };
// данные компании: либо сохранённая компания, либо черновик чата (пока компанию не назвали)
const facts = c => co() || (c.draft ||= {});
function absorb(c, text){
  const f = facts(c), m = text.match(URL_RE);
  if (m) f.site = m[1].replace(/[.,;)]+$/, '');
  if (!f.city) { const low = ' ' + text.toLowerCase(); const city = CITIES.find(x => { const stem = x.length > 5 ? x.toLowerCase().slice(0, -1) : x.toLowerCase(); return new RegExp('[^а-яёәіңғүұқөһ]' + stem).test(low) }); if (city) f.city = city }
}
function fill(c, slot, text){
  const v = text.trim().replace(/^[«"']+|[»"'.!]+$/g, '').slice(0, 60);
  if (slot === 'site') { const m = text.match(URL_RE); if (!m) return false; facts(c).site = m[1].replace(/[.,;)]+$/, ''); return true }
  if (!v) return false;
  if (slot === 'name' && !co()) {
    const d = c.draft || {}, nc = { id: uid(), name: v, niche: d.niche || '', city: d.city || '', site: d.site || '' };
    S.companies.unshift(nc); S.co = nc.id; c.companyId = nc.id; delete c.draft; return true
  }
  facts(c)[slot] = slot === 'city' ? (CITIES.find(x => x.toLowerCase().startsWith(v.toLowerCase().slice(0, 4))) || v) : v;
  return true;
}

/* ---------- чат ---------- */
function newChat(){ const c = { id: uid(), companyId: S.co, title: '', msgs: [], at: Date.now() }; S.chats.unshift(c); S.chat = c.id; return c }
function ensureChat(){ return chat() || newChat() }
function addMsg(c, m){ m.id = m.id || uid(); c.msgs.push(m); c.at = Date.now(); return m }

async function onSend(text, forced){
  text = (text || '').trim();
  if (!text || UI.busy) return;
  UI.view = 'chat';
  const c = ensureChat();
  if (!c.title) c.title = text.slice(0, 48);
  addMsg(c, { r: 'u', text });
  if (forced) c.pending = null;
  if (c.pending && c.pending.slot) {
    if (!fill(c, c.pending.slot, text)) { addMsg(c, { r: 'a', text: c.pending.slot === 'site' ? t('badSite') : t('ask')[c.pending.slot] }); save(); return renderAll() }
  } else {
    absorb(c, text);
    c.pending = { intent: forced || intentOf(text), q: text };
  }
  save(); renderAll();
  proceed(c);
}
function proceed(c){
  const p = c.pending; if (!p) return;
  const f = facts(c), miss = NEEDS[p.intent].find(k => !f[k] || (k === 'name' && !co()));
  if (miss) {
    p.slot = miss;
    const hint = t('askHint')[miss];
    const chips = miss === 'city' ? CITIES.slice(0, 4).map(x => ({ text: x })) : [];
    addMsg(c, { r: 'a', text: t('ask')[miss] + (hint ? '\n' + hint : ''), chips, ask: true });
    save(); return renderAll();
  }
  c.pending = null; save();
  run(c, p.intent, p.q);
}

/* ---------- действия: только настоящие запросы ---------- */
async function run(c, intent, q){
  const m = addMsg(c, { r: 'a', steps: [], running: true, intent, q });
  UI.busy = true; UI.openSteps.add(m.id); renderAll();
  const step = (text, ok = null) => { m.steps.push({ text, ok }); renderConv(); return m.steps.length - 1 };
  const done = (i, ok, text) => { if (m.steps[i]) { m.steps[i].ok = ok; if (text) m.steps[i].text = text } renderConv() };
  try {
    if (intent === 'measure') await doMeasure(c, m, step, done);
    else if (intent === 'audit') await doAudit(c, m, step, done);
    else if (intent === 'why') await doWhy(c, m, step, done);
    else await doAgent(c, m, intent, q, step, done);
  } catch (e) {
    m.steps.forEach(s => { if (s.ok === null) s.ok = false });
    m.error = e.message || String(e); m.down = !!e.down; m.retry = { intent, q };
  }
  m.running = false; UI.busy = false; UI.openSteps.delete(m.id); save(); renderAll();
  if (m.art && innerWidth > 900) openArt(m.art);
}

async function doMeasure(c, m, step, done){
  const f = co(), eng = engName(UI.provider) || 'нейросети';
  step(`Задаю 3 вопроса ${eng} — как спросил бы покупатель в городе ${f.city}`, true);
  const results = []; let failed = 0, lastErr = null;
  for (let i = 0; i < 3; i++) {
    const s = step(`Вопрос ${i + 1} из 3…`);
    try {
      const d = await call('/api/quick', { company: f.name, niche: f.niche, city: f.city, i });
      const r = d.result; results.push(r);
      done(s, true, `«${cap(r.question)}» — ${r.named ? 'назвали ' + f.name : 'не назвали'}`);
    } catch (e) {
      if (e.down && !results.length) throw e;
      failed++; lastErr = e; done(s, false, `Вопрос ${i + 1}: ${e.message}`);
    }
  }
  if (!results.length) throw lastErr || new ApiError('Нейросеть не ответила.', false);
  const named = results.filter(r => r.named).length;
  step(`Считаю, где назвали «${f.name}»: ${named} из ${results.length}`, true);
  f.lastMeasure = { at: Date.now(), results };
  const art = { id: uid(), type: 'report', title: 'Замер видимости', sub: `${f.name} · ${f.niche} · ${f.city}`, data: { company: f.name, niche: f.niche, city: f.city, results, at: Date.now() } };
  m.art = art; m.label = howLabel(results);
  m.text = named === 0
    ? `Нейросеть ответила на ${results.length} ${results.length === 1 ? 'вопрос' : 'вопроса'} о нише «${f.niche}» в городе ${f.city} и **ни разу не назвала ${f.name}**. Это частая картина: она советует тех, о ком много пишут на картах, в подборках и на сайтах.`
    : `Нейросеть назвала **${f.name}** в ${named} из ${results.length} ответов о нише «${f.niche}» в городе ${f.city}.`;
  if (failed) m.text += '\n' + t('partial')(failed);
  m.next = ['why', 'faq', f.site ? 'audit' : null].filter(Boolean);
}
function howLabel(results){
  const engs = [...new Set(results.map(r => engName(r.engine)).filter(Boolean))].join(', ') || 'нейросеть';
  const srch = results.map(r => r.search);
  const all = srch.every(x => x === true), none = srch.every(x => x === false);
  const how = all ? 'с поиском в интернете' : none ? 'без поиска — по памяти модели' : srch.some(x => x === true) ? 'часть ответов с поиском' : '';
  const models = [...new Set(results.map(r => r.model).filter(Boolean))].join(', ');
  return { text: [engs + (models ? ' · ' + models : ''), how].filter(Boolean).join(' · '), warn: !all };
}

async function doAudit(c, m, step, done){
  const f = facts(c);
  const s = step(`Читаю сайт ${f.site}: robots.txt, главную страницу и карту сайта…`);
  const d = await call('/api/site-audit', { url: f.site }, 60000);
  done(s, true, `Прочитал ${d.url}`);
  const closed = d.bots.filter(b => b.allowed === false).length, unk = d.bots.filter(b => b.allowed === null).length, bad = d.checks.filter(x => !x.ok).length;
  step(`Боты нейросетей: открыт доступ ${d.bots.length - closed - unk} из ${d.bots.length}${closed ? `, закрыт ${closed}` : ''}${unk ? `, неизвестно ${unk}` : ''}`, closed === 0 && unk === 0);
  step(`Признаки страницы: в порядке ${d.checks.length - bad} из ${d.checks.length}`, bad === 0);
  m.art = { id: uid(), type: 'audit', title: 'Проверка сайта', sub: d.url, data: d };
  m.label = { text: 'Без нейросети: сервер сам открыл страницы сайта', warn: false };
  m.text = bad || closed
    ? `Проверил **${d.url}**. Нашёл, что поправить: ${bad} ${bad === 1 ? 'пункт' : 'пунктов'} на странице${closed ? ` и ${closed} ${closed === 1 ? 'бот закрыт' : 'ботов закрыто'} в robots.txt` : ''}. Список — в панели справа.`
    : `Проверил **${d.url}**: всё, что я умею проверять, в порядке.`;
  m.next = ['faq', 'measure'];
}

// [задача сервера, заголовок, иконка, куда публиковать: 'wp' | 'tg' — работает; строка — честное «скоро»]
const AGENT = { faq: ['faq', 'Страница «Вопросы и ответы»', 'file', 'wp'], tgpost: ['tgpost', 'Пост для Telegram-канала', 'tg', 'tg'], review: ['review', 'Просьба оставить отзыв', 'star', 'Отправить клиентам в WhatsApp'], bio: ['bio', 'Описание профиля Instagram', 'cam', 'Обновить профиль Instagram'], chat: ['chat', 'Ответ Körin', 'chat', ''] };
async function doAgent(c, m, intent, q, step, done){
  const [task, title, , pub] = AGENT[intent] || AGENT.chat, f = facts(c);
  const ctx = { company: f.name || '', niche: f.niche || '', city: f.city || '', rivals: [] };
  if (f.site) ctx.links = { 'Сайт': f.site };
  if (f.lastMeasure) ctx.not_named_on = f.lastMeasure.results.filter(r => !r.named).map(r => r.question);
  const s = step(intent === 'chat' ? 'Думаю над ответом…' : `Пишу черновик: ${title.toLowerCase()}${f.site ? ' — сначала прочитаю ваш сайт' : ''}…`);
  const d = await call('/api/agent', { task, question: q.slice(0, 1000), context: ctx });
  m.steps.splice(s, 1);
  (d.steps || []).forEach(x => step(x.text, !!x.ok));
  m.label = { text: `Текст написала нейросеть ${d.model || ''}`.trim(), warn: false };  // /api/agent не сообщает engine/search — пишем только модель
  if (intent === 'chat') { m.text = d.text || ''; m.next = []; return }
  m.art = { id: uid(), type: 'draft', title, sub: f.name || '', data: { text: clean(d.text), pub, model: d.model } };
  const live = pub === 'tg' || pub === 'wp';
  m.text = (/\[(что вписать|не знаю)/i.test(d.text || '') ? `Черновик готов. Места, где нужны ваши факты, отмечены **[что вписать]** — замените их перед публикацией.` : 'Черновик готов. Прочитайте его и поправьте прямо в панели.')
    + (live ? ` Опубликовать в ${SVC[pub]} можно кнопкой под черновиком — сначала покажу, как это будет выглядеть.` : '');
  m.next = intent === 'faq' ? ['tgpost', 'review'] : intent === 'tgpost' ? ['faq', 'review'] : intent === 'review' ? ['tgpost', 'bio'] : ['faq', 'tgpost'];
}

async function doWhy(c, m, step, done){
  const f = co();
  if (!f.lastMeasure) { m.text = t('needMeasure'); renderConv(); await doMeasure(c, m, step, done); m.text = t('needMeasure') + '\n\n' + m.text; m.art2 = m.art; m.label2 = m.label }
  const res = f.lastMeasure.results;
  const s = step('Перечитываю ответы нейросети и сайты, на которые она ссылается…');
  const sources = [...new Set(res.flatMap(r => r.sources || []))];
  const d = await call('/api/analyze', { company: f.name, niche: f.niche, city: f.city, rivals: [], site: f.site || '', sources, answers: res.map(r => ({ q: r.question, a: r.answer })) });
  m.steps.splice(s, 1);
  (d.steps || []).forEach(x => step(x.text, !!x.ok));
  const a = d.analysis;
  m.art = { id: uid(), type: 'analysis', title: 'Почему называют конкурентов', sub: `${f.name} · ${f.city}`, data: { analysis: a, text: d.text || '', model: d.model } };
  m.label = { text: `Разбор написала нейросеть ${d.model || ''}`.trim() + ' по ответам замера', warn: false };
  const why = a && a.verdict ? `**${a.verdict}**` : 'Разбор готов.';
  m.text = (m.text ? m.text + '\n\n' : '') + why + (a && a.gaps && a.gaps.length ? `\nЧто сделать первым: ${a.gaps[0].title}.` : '');
  m.next = ['faq', 'review'];
}

/* ---------- мини-разметка ответа ---------- */
function md(s){
  const inl = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[(что вписать|не знаю)[^\]]*\]/gi, m => `<span class="ex" style="text-transform:none;letter-spacing:0">${m}</span>`);
  const out = []; let list = null;
  for (const raw of String(s || '').split('\n')) {
    const line = raw.trim();
    const li = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)/);
    if (li) { (list ||= []).push(`<li>${inl(li[1])}</li>`); continue }
    if (list) { out.push(`<ul style="margin:4px 0;padding-left:20px">${list.join('')}</ul>`); list = null }
    if (!line) continue;
    const h = line.match(/^#{1,4}\s+(.*)/);
    out.push(h ? `<p><b>${inl(h[1])}</b></p>` : `<p>${inl(line)}</p>`);
  }
  if (list) out.push(`<ul style="margin:4px 0;padding-left:20px">${list.join('')}</ul>`);
  return out.join('');
}
const cap = s => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);
// черновик для вставки: без значков разметки (## и **), но с абзацами
const clean = s => String(s || '').split('\n').map(l => l.replace(/^\s*#{1,6}\s+/, '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/^\s*[*•]\s+/, '— ')).join('\n').replace(/\n{3,}/g, '\n\n').trim();

function stepIcon(ok){ return ok === null ? '<span class="spin" aria-label="…"></span>' : ok ? ic('check', 'st-ok') : ic('no', 'st-no') }
function msgHTML(m){
  if (m.r === 'u') return `<div class="msg-u">${esc(m.text)}</div>`;
  let h = '';
  if (m.steps && m.steps.length) {
    const open = m.running || UI.openSteps.has(m.id);
    const run = m.steps.find(s => s.ok === null);
    h += `<details class="steps" data-steps="${m.id}" ${open ? 'open' : ''}><summary>${m.running ? '<span class="spin"></span>' + esc(run ? run.text : t('working')) : ic('list') + t('steps')(m.steps.length)}${ic('chev', 'chev')}</summary><ol>${m.steps.map(s => `<li><span class="st-ic">${stepIcon(s.ok)}</span><span>${esc(s.text)}</span></li>`).join('')}</ol></details>`;
  }
  if (m.text) h += `<div class="prose">${md(m.text)}</div>`;
  if (m.link && /^https:\/\//.test(m.link.href)) h += `<a class="btn" style="align-self:flex-start" href="${esc(m.link.href)}" target="_blank" rel="noopener">${ic('ext')}${esc(m.link.text)}</a>`;
  if (m.running && !m.text) h += `<div class="typing" aria-label="${t('working')}"><i></i><i></i><i></i></div>`;
  if (m.error) h += `<div class="err" role="alert"><b>${t('fail')}.</b> ${esc(m.error)}<div class="row"><button class="btn" data-retry="${m.id}">${ic('refresh')}${t('retry')}</button></div></div>`;
  for (const l of [m.label2, m.label]) if (l && l.text) h += `<span class="label ${l.warn ? 'warn' : ''}"><span class="dot ${l.warn ? '' : 'ok'}"></span>${esc(l.text)}</span>`;
  for (const a of [m.art2, m.art].filter((x, i, arr) => x && arr.indexOf(x) === i)) {
    const icon = a.type === 'report' ? 'report' : a.type === 'audit' ? 'list' : a.type === 'analysis' ? 'why' : 'file';
    h += `<button class="art-card" data-art="${m.id}:${a.id}"><span class="ai">${ic(icon)}</span><span><span class="at">${esc(a.title)}</span><span class="as" style="display:block">${esc(a.sub || '')} · ${t('open')}</span></span><span class="go">${ic('right')}</span></button>`;
  }
  const chips = [...(m.chips || []).map(x => ({ text: x.text })), ...(m.next || []).map(id => { const ch = t('chips').find(x => x[0] === id); return ch && { text: ch[2], intent: id, icon: ch[1] } }).filter(Boolean)];
  if (chips.length && !m.running) h += `<div class="next">${chips.map(x => `<button class="chip" data-say="${esc(x.text)}" ${x.intent ? `data-intent="${x.intent}"` : ''}>${x.icon ? ic(x.icon) : ''}${esc(x.text)}</button>`).join('')}</div>`;
  return `<div class="msg-a">${markEl}<div class="body">${h}</div></div>`;
}
function renderConv(force){
  const box = $('#conv'), c = chat(); if (!box || !c) return;
  const sc = $('#scroller'), near = force || (sc.scrollHeight - sc.scrollTop - sc.clientHeight < 140);
  box.innerHTML = c.msgs.map(msgHTML).join('');
  if (near) sc.scrollTop = sc.scrollHeight;
  const btn = $('#sendBtn'); if (btn) btn.disabled = UI.busy || !$('#inp').value.trim();
}
function bindComposer(){
  const f = $('#form'), inp = $('#inp'), btn = $('#sendBtn'); if (!f) return;
  const fit = () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 200) + 'px'; btn.disabled = UI.busy || !inp.value.trim() };
  inp.addEventListener('input', fit);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); f.requestSubmit() } });
  f.addEventListener('submit', e => { e.preventDefault(); const v = inp.value; if (!v.trim() || UI.busy) return; inp.value = ''; onSend(v) });
  if (innerWidth > 900) inp.focus();
}

  if (key === 'sample') return sampleArt();
  const [mid, aid] = key.split(':'); const c = chat(); if (!c) return null;
  const m = c.msgs.find(x => x.id === mid); if (!m) return null;
  return [m.art, m.art2].find(a => a && a.id === aid) || null;
}

      <div class="p-sec"><h3>Боты нейросетей в robots.txt</h3>${d.bots.map(b => { const [k, w, i] = botState(b); return `<div class="chk"><span class="ci ${k}">${ic(i)}</span><div><div class="cl">${esc(b.bot)} <span class="tag ${k}" style="margin-left:4px">${w}</span></div><div class="cd">${esc(b.what)}</div></div></div>` }).join('')}</div>`;

/* Подвал черновика: настоящая публикация для Telegram и WordPress, честное «скоро» для остального */
function draftFoot(a){
  const pub = a.data.pub, live = pub === 'tg' || pub === 'wp';
  const copyB = `<button class="btn ${live && CN[pub] ? '' : 'btn-p'}" data-copy>${ic('copy')}${t('copy')}</button>`;
  if (!pub) return `<div class="acts">${copyB}</div>`;
  if (!live) return `<div class="acts">${copyB}<button class="btn" disabled title="${esc(pub)} — ${t('soon')}">${ic('check')}${t('publish')} <span class="soon">${t('soon')}</span></button></div><span class="hint">${esc(pub)}: подключение появится скоро. Сейчас — скопируйте и вставьте вручную.</span>`;
  const c = CN[pub], name = SVC[pub];
  if (!c) return `<div class="acts"><button class="btn btn-p" data-act="cn-${pub}">${ic('plug')}Подключить ${name}</button>${copyB}</div><span class="hint">Чтобы Körin опубликовал этот текст, подключите ${pub === 'tg' ? 'ваш Telegram-канал' : 'сайт на WordPress'} — это пара минут. Публикация всегда только после вашего одобрения.</span>`;
  const where = pub === 'tg' ? `канал «${esc(c.title || c.chat)}»` : `сайт ${esc(c.site.replace(/^https:\/\//, ''))}`;
  return `<div class="acts"><button class="btn ${a.data.published ? '' : 'btn-p'}" data-act="pub">${ic(pub === 'tg' ? 'tg' : 'send')}${a.data.published ? 'Опубликовать ещё раз…' : `Опубликовать в ${name}…`}</button>${copyB}</div><span class="hint">Куда: ${where}. Сначала покажу предпросмотр — без вашего подтверждения ничего не уйдёт.</span>`;
}
function artText(a){
  const d = a.data;
  if (a.type === 'report') return `${a.sample ? '[ПРИМЕР] ' : ''}Замер видимости: ${d.company} · ${d.niche} · ${d.city}\nНазвали в ${d.results.filter(r => r.named).length} из ${d.results.length} ответов.\n\n` + d.results.map(r => `— ${r.question}\n  ${r.named ? 'назвали' : 'не назвали'}\n  ${r.answer}`).join('\n\n');
  if (a.type === 'audit') return `Проверка сайта ${d.url}\n\n` + d.checks.map(x => `${x.ok ? '✓' : '✗'} ${x.label} (${x.detail})`).join('\n') + '\n\nБоты нейросетей:\n' + d.bots.map(b => `${b.allowed === true ? '✓' : b.allowed === false ? '✗' : '?'} ${b.bot} — ${b.what}`).join('\n');

  if (act === 'new') { S.chat = null; UI.view = 'chat'; closeArt(); $('#app').classList.remove('menu'); save(); return renderAll() }
  if (act === 'add-co') { S.co = null; S.chat = null; UI.view = 'chat'; closeArt(); $('#app').classList.remove('menu'); save(); renderAll(); toast(t('newCoChat')); return }

  if (el.dataset.retry) {
    const c = chat(), m = c && c.msgs.find(x => x.id === el.dataset.retry); if (!m || UI.busy) return;
    const r = m.retry; c.msgs = c.msgs.filter(x => x !== m); save(); renderAll();
    return run(c, r.intent, r.q);
  }
});
$('#scrim').addEventListener('click', () => $('#app').classList.remove('menu'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#app').classList.contains('menu')) $('#app').classList.remove('menu'); else if (UI.art) closeArt() } });
let wasMobile = innerWidth <= 900;
addEventListener('resize', () => { const mob = innerWidth <= 900; if (mob !== wasMobile) { wasMobile = mob; renderSide() } });

/* ссылка с сайта: ?company=Название — сразу заводим компанию; ?src= — метка, откуда пришёл человек */
(() => {
  const name = (new URLSearchParams(location.search).get('company') || '').trim().slice(0, 40);
  if (!name) return;
  let c = S.companies.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (!c) { c = { id: uid(), name, niche: '', city: '', site: '' }; S.companies.unshift(c) }
  if (S.co !== c.id) { S.co = c.id; S.chat = null }
  save();
})();
const SHEET = 'https://script.google.com/macros/s/AKfycbymjjOb_07W6QFm-vZu7EpVT9kvzA8WbfzVFvVA4UfU5bKlHRZ3G1pCIDZ2kY0nP1CG/exec';
/* те же номер посетителя и метка источника (ключ korin-src), что на странице Körin; в автотестах ничего не шлём */
const TRK = (() => {
  let vid = null; try { vid = localStorage.getItem('vid'); if (!vid) { vid = Math.random().toString(36).slice(2, 7).toUpperCase(); localStorage.setItem('vid', vid) } } catch (e) { vid = 'без номера' }
  const P = new URLSearchParams(location.search);
  let src = (P.get('utm_source') || P.get('src') || (document.referrer && !document.referrer.includes(location.hostname) ? new URL(document.referrer).hostname : '')).slice(0, 40);
  try { if (src) sessionStorage.setItem('korin-src', src); else src = sessionStorage.getItem('korin-src') || '' } catch (e) {}
  src = src || 'прямой заход';
  const dev = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'телефон' : 'компьютер', t0 = Date.now();
  let left = false;
  const track = (what, extra, beacon) => {
    if (navigator.webdriver) return;
    const body = JSON.stringify({ name: 'Körin кабинет: ' + what, business: extra || 'откуда: ' + src, whatsapp: 'посетитель ' + vid + ' · ' + dev, lang: 'korin' });
    try { if (beacon && navigator.sendBeacon) navigator.sendBeacon(SHEET, body); else fetch(SHEET, { method: 'POST', mode: 'no-cors', body, keepalive: true }).catch(() => {}) } catch (e) {}
  };
  let seen = false; try { seen = sessionStorage.getItem('seen-Körin кабинет'); sessionStorage.setItem('seen-Körin кабинет', 1) } catch (e) {}
  if (!seen) track('зашёл');
  addEventListener('pagehide', () => { if (!left) { left = true; track('ушёл: был ' + Math.round((Date.now() - t0) / 1000) + ' сек', '', true) } });
  return { track, vid, src };
})();

document.documentElement.lang = S.lang === 'kk' ? 'kk' : 'ru';
renderAll();
ping();
