<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körin — кабинет</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--white:#fff;--ink:#0b1437;--muted:#5d6785;--line:#e3e7f2;--soft:#eef2ff;--blue:#2355ff;--blue-d:#1238c9;--good:#12b76a;--bad:#f04438;--warn:#f79009;--sh:0 1px 2px rgba(11,20,55,.05),0 12px 32px -12px rgba(11,20,55,.14)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Onest",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1{font-size:clamp(24px,5vw,32px);letter-spacing:-.035em;font-weight:800;line-height:1.15}
h2{font-size:19px;letter-spacing:-.02em;font-weight:800}
h4{font-size:14.5px;font-weight:700}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(35,85,255,.45);outline-offset:2px;border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:var(--white);font-weight:700;font-size:14.5px;white-space:nowrap}
.btn:hover{border-color:#c3cbe0}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-blue:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn-sm{min-height:36px;padding:0 13px;font-size:13.5px;border-radius:9px}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.pill.demo{color:#93540a;background:#fff4dd;border:1px solid #ffe0a3}
.pill.ok{color:#067647;background:#e7f8ef}.pill.no{color:#b42318;background:#fee4e2}.pill.soon{color:var(--muted);background:var(--bg)}

/* layout */
.shell{display:grid;grid-template-rows:auto auto 1fr;min-height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding:0 14px;height:58px;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:-.04em}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--blue);display:grid;place-items:center}
.logo i::after{content:"";width:11px;height:11px;border-radius:50%;border:3px solid #fff}
.co{margin-left:8px;font-weight:600;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.topbar .sp{flex:1}
.nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--white);border-bottom:1px solid var(--line);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.nav a::before{content:"";width:8px;height:8px;border-radius:3px;background:#cfd6ea}
.nav a.on{background:var(--soft);color:var(--blue)}.nav a.on::before{background:var(--blue)}
.nav b{display:none}
.nav .help{display:none}
main{padding:18px 14px 90px;min-width:0;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:18px}
.head p{color:var(--muted);font-size:14px;margin-top:3px}
.seg{display:flex;margin-left:auto;background:#e9ecf5;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(11,20,55,.16)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.kpi b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.04em;font-weight:800;margin-top:6px}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.main{background:var(--blue);border-color:var(--blue);color:#fff}.kpi.main small,.kpi.main span{color:rgba(255,255,255,.82)}.kpi.main b{font-size:40px}
.cols{display:grid;gap:12px;margin-top:12px}
.box{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.box>h4{margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.box>h4 small{font-size:12.5px;font-weight:500;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(90px,140px) 1fr 44px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row u{display:block;height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.row i{display:block;height:100%;border-radius:99px;background:#c3cbe0}
.row.me i{background:var(--blue)}.row.me span:first-child{color:var(--blue);font-weight:700}
.row em{font-style:normal;font-weight:700;font-size:13.5px;text-align:right}
svg.trend{width:100%;height:150px;display:block}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}td.n,th.n{text-align:right;font-weight:700;white-space:nowrap}
tr.me td{background:var(--soft);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#dfe3ee}.dot.y{background:var(--good)}
.q small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}.q small b{color:var(--bad);font-weight:600}
.add{display:flex;gap:8px;margin-top:14px}
.inp{min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--white);padding:0 14px;width:100%;font-size:15px}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(35,85,255,.15)}
.task{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0;padding-top:0}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue)}
.task p{font-size:13.5px;color:var(--muted);margin-top:3px}
.task.done h4{text-decoration:line-through;color:var(--muted)}
.task .btn{margin-top:10px}
.conns{display:grid;gap:12px}
.conn{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.conn .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:15px}
.conn p{font-size:13.5px;color:var(--muted);margin:3px 0 10px}
.banner{background:#fff4dd;border:1px solid #ffe0a3;color:#7a4407;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.agency{background:var(--ink);color:#fff;border-radius:14px;padding:18px;margin-top:12px;display:grid;gap:12px}
.agency p{color:#b9c2de;font-size:14px;margin-top:4px}

/* onboarding */
.onb{max-width:560px;margin:5vh auto 0;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:26px 20px;box-shadow:var(--sh)}
.onb .steps{display:flex;gap:6px;margin-bottom:22px}.onb .steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}.onb .steps i.on{background:var(--blue)}
.onb label{display:block;font-size:13.5px;font-weight:600;margin:16px 0 6px}
.onb .acts{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips span{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--blue);font-weight:600;font-size:13.5px;border-radius:999px;padding:6px 6px 6px 12px}
.chips button{border:0;background:rgba(35,85,255,.15);color:var(--blue);width:20px;height:20px;border-radius:50%;line-height:1;font-size:13px;padding:0}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:18px 0 10px}.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .5s}

/* assistant */
.fab{position:fixed;right:16px;bottom:16px;z-index:30;box-shadow:0 12px 28px -8px rgba(35,85,255,.7);min-height:50px;border-radius:999px}
.drawer{position:fixed;z-index:40;inset:auto 0 0 0;height:min(84dvh,640px);background:var(--white);border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -20px 60px -20px rgba(11,20,55,.4);display:none;flex-direction:column}
.drawer.open{display:flex}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800}
.dh button{margin-left:auto;border:0;background:var(--bg);width:34px;height:34px;border-radius:9px;font-size:18px}
.db{flex:1;overflow-y:auto;padding:16px;display:grid;gap:10px;align-content:start;background:var(--bg)}
.m{max-width:92%;padding:11px 14px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;background:var(--white);border:1px solid var(--line)}
.m.u{justify-self:end;background:var(--blue);color:#fff;border-color:var(--blue)}
.quick{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;border-top:1px solid var(--line);scrollbar-width:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.df{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}

@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}.conns{grid-template-columns:repeat(2,1fr)}.onb{padding:34px}}
@media (min-width:980px){
  .shell{grid-template-columns:230px 1fr;grid-template-rows:auto 1fr}
  .topbar{grid-column:1/-1;padding:0 22px}
  .nav{flex-direction:column;overflow:visible;padding:18px 12px;border-bottom:0;border-right:1px solid var(--line);gap:2px}
  .nav b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9aa3bd;margin:0 12px 8px}
  .nav .help{display:block;margin-top:auto;background:var(--soft);border-radius:12px;padding:14px;font-size:13px;color:var(--muted)}
  .nav .help a{display:inline;padding:0;color:var(--blue);font-weight:700}.nav .help a::before{display:none}
  main{padding:26px 28px 90px}
  .cols{grid-template-columns:1.2fr .8fr}.cols.eq{grid-template-columns:1fr 1fr}
  .conns{grid-template-columns:repeat(3,1fr)}
  .agency{grid-template-columns:1fr auto;align-items:center}
  .drawer{inset:0 0 0 auto;width:420px;height:auto;border-radius:0;border-width:0 0 0 1px}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = 'korin-demo-v1';
const store = { load(){ try{ return JSON.parse(localStorage.getItem(KEY)) }catch(e){ return null } }, save(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)) }catch(e){} }, clear(){ try{ localStorage.removeItem(KEY) }catch(e){} } };

const ENGINES = [['chatgpt','ChatGPT'],['gemini','Gemini'],['perplexity','Perplexity']];
const CONNECTORS = [
  ['site','WWW','Сайт','Проверяем, может ли нейросеть прочитать страницы и что на них не хватает.'],
  ['instagram','IG','Instagram','Берём описание профиля и посты, чтобы сверить с тем, что говорит нейросеть.'],
  ['facebook','FB','Facebook','Страница компании и отзывы на ней.'],
  ['gbp','G','Google Карты','Карточка компании, рейтинг и отзывы.'],
  ['2gis','2G','2ГИС','Карточка, отзывы и актуальность адреса и телефона.'],
  ['ga','GA','Google Analytics','Считаем переходы на сайт из ChatGPT и других нейросетей.'],
  ['whatsapp','WA','WhatsApp','Уведомления, когда видимость упала или появился новый конкурент.']
];
const QUESTIONS = n => [
  `${n.niche} в городе ${n.city}: что выбрать?`, `${n.niche}, ${n.city} — кого посоветуешь?`,
  `${n.niche}: кому можно доверять, ${n.city}?`, `${n.niche} недорого и качественно, ${n.city}`,
  `${n.niche} с хорошими отзывами, ${n.city}`, `${n.niche}, ${n.city}: сравни варианты, плюсы и минусы`,
  `${n.niche} рядом со мной, ${n.city}`, `${n.niche} для семьи с детьми, ${n.city}`,
  `${n.niche}, ${n.city}: что сейчас самое популярное?`, `${n.city} қаласында ${n.niche}: қайсысын таңдаған дұрыс?`
];
const SOURCE_POOL = ['2gis.kz','google.com/maps','instagram.com','yandex.kz/maps','the-steppe.com','tengrinews.kz','olx.kz','kaspi.kz','facebook.com','zoon.kz'];

/* Демо-данные: числа получаются из названий по формуле, а не из ответов нейросетей. */
function rng(seed){ let h = 2166136261; for (const ch of seed) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) } return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
function build(st){
  const names = [st.company, ...st.rivals], qs = [...QUESTIONS(st), ...(st.custom || [])];
  const data = { names, qs, eng: {} };
  for (const [id] of ENGINES) {
    const r = rng(st.company + '|' + st.rivals.join(',') + '|' + id);
    const strength = names.map((n, i) => i === 0 ? .22 + r() * .25 : .25 + r() * .5);
    const grid = qs.map(q => { const rq = rng(q + id + st.company); return names.map((n, i) => rq() < strength[i]) });
    const count = names.map((n, i) => grid.filter(g => g[i]).length);
    const vis = count.map(c => Math.round(c / qs.length * 100));
    const rs = rng('src' + st.company + id), src = SOURCE_POOL.map(s => [s, Math.round(rs() * 40) + 2]).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const tr = rng('trend' + st.company + id); let v = Math.max(3, vis[0] - 18 - Math.round(tr() * 8)); const trend = [];
    for (let i = 0; i < 5; i++) { trend.push(v); v = Math.min(vis[0], v + Math.round(tr() * 8)) } trend.push(vis[0]);
    const good = 45 + Math.round(rs() * 25), bad = 3 + Math.round(rs() * 9);
    data.eng[id] = { grid, vis, src, trend, tone: [good, 100 - good - bad, bad], cites: Math.round(rs() * vis[0] / 4) };
  }
  return data;
}

let st = store.load(), data = st && st.ready ? build(st) : null, engine = 'chatgpt';
const param = new URLSearchParams(location.search).get('company');
if (!st) st = { company: param ? param.slice(0, 40) : '', city: 'Алматы', niche: '', rivals: [], conn: {}, done: {}, custom: [], ready: false, step: 1 };

/* ---------- Onboarding ---------- */
function onboarding(){
  const s = st.step || 1;
  const bar = `<div class="steps"><i class="on"></i><i class="${s > 1 ? 'on' : ''}"></i><i class="${s > 2 ? 'on' : ''}"></i></div>`;
  let body = '';
  if (s === 1) body = `<h1>Расскажите о компании</h1><p class="muted" style="margin-top:8px">Это займёт минуту. Потом всё можно поменять.</p>
    <label for="o1">Название компании</label><input class="inp" id="o1" maxlength="40" value="${esc(st.company)}" placeholder="Например, Hello Kids">
    <label for="o2">Чем занимаетесь</label><input class="inp" id="o2" maxlength="40" value="${esc(st.niche)}" placeholder="Например, курсы английского">
    <label for="o3">Город</label><input class="inp" id="o3" maxlength="30" value="${esc(st.city)}">
    <div class="acts"><a class="btn" href="../">На сайт</a><button class="btn btn-blue" id="next">Дальше</button></div>`;
  if (s === 2) body = `<h1>Кто ваши конкуренты?</h1><p class="muted" style="margin-top:8px">Добавьте от одного до пяти. С ними будем сравнивать.</p>
    <label for="o4">Название конкурента</label><div class="add" style="margin-top:0"><input class="inp" id="o4" maxlength="40" placeholder="Например, Lingua Plus"><button class="btn" id="addr">Добавить</button></div>
    <div class="chips">${st.rivals.map((r, i) => `<span>${esc(r)}<button data-del="${i}" aria-label="Убрать">×</button></span>`).join('')}</div>
    <div class="acts"><button class="btn" id="back">Назад</button><button class="btn btn-blue" id="next">Дальше</button></div>`;
  if (s === 3) body = `<h1>Запускаем первую проверку</h1><p class="muted" style="margin-top:8px">Зададим нейросетям 10 вопросов о нише «${esc(st.niche)}» в городе ${esc(st.city)}.</p>
    <div class="banner" style="margin-top:18px">Демо-режим. Нейросети сейчас не опрашиваются: цифры в кабинете условные и считаются по формуле.</div>
    <div class="prog"><i id="pg"></i></div><p class="muted" id="pgt">Готово к запуску</p>
    <div class="acts"><button class="btn" id="back">Назад</button><button class="btn btn-blue" id="run">Запустить</button></div>`;
  $('#root').innerHTML = `<div class="topbar"><a class="logo" href="../"><i></i>Körin</a></div><div style="padding:0 14px 40px"><div class="onb">${bar}${body}<p class="muted" id="err" style="color:var(--bad);margin-top:12px;min-height:20px"></p></div></div>`;
  const err = m => $('#err').textContent = m;
  $('#back') && ($('#back').onclick = () => { st.step = s - 1; store.save(st); onboarding() });
  if (s === 1) $('#next').onclick = () => {
    st.company = $('#o1').value.trim(); st.niche = $('#o2').value.trim(); st.city = $('#o3').value.trim();
    if (!st.company || !st.niche || !st.city) return err('Заполните все три поля.');
    st.step = 2; store.save(st); onboarding();
  };
  if (s === 2) {
    const add = () => { const v = $('#o4').value.trim(); if (!v) return; if (st.rivals.length >= 5) return err('Не больше пяти конкурентов.'); if ([st.company, ...st.rivals].some(x => x.toLowerCase() === v.toLowerCase())) return err('Такое название уже есть.'); st.rivals.push(v); store.save(st); onboarding(); $('#o4').focus() };
    $('#addr').onclick = add; $('#o4').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add() } };
    $$('[data-del]').forEach(b => b.onclick = () => { st.rivals.splice(+b.dataset.del, 1); store.save(st); onboarding() });
    $('#next').onclick = () => { if (!st.rivals.length) return err('Добавьте хотя бы одного конкурента.'); st.step = 3; store.save(st); onboarding() };
  }
  if (s === 3) $('#run').onclick = () => {
    $('#run').disabled = true; const stages = ['Составляем вопросы…', 'Спрашиваем ChatGPT…', 'Спрашиваем Gemini…', 'Спрашиваем Perplexity…', 'Считаем упоминания…'];
    stages.forEach((t, i) => setTimeout(() => { $('#pg').style.width = (i + 1) * 20 + '%'; $('#pgt').textContent = t }, i * 550));
    setTimeout(() => { st.ready = true; store.save(st); data = build(st); location.hash = '#/overview'; app() }, stages.length * 550 + 300);
  };
}

/* ---------- App ---------- */
const NAV = [['overview','Обзор'],['questions','Вопросы'],['rivals','Конкуренты'],['sources','Источники'],['tasks','Что сделать'],['connectors','Подключения'],['settings','Настройки']];
const segHtml = () => `<div class="seg" role="group" aria-label="Нейросеть">${ENGINES.map(([id, n]) => `<button type="button" data-eng="${id}" aria-pressed="${id === engine}">${n}</button>`).join('')}</div>`;
const E = () => data.eng[engine];
const ranked = () => data.names.map((n, i) => [n, E().vis[i], i === 0]).sort((a, b) => b[1] - a[1]);
const gaps = () => data.qs.map((q, qi) => ({ q, who: data.names.filter((n, i) => i > 0 && E().grid[qi][i]), me: E().grid[qi][0] })).filter(g => !g.me && g.who.length);

function viewOverview(){
  const e = E(), r = ranked(), place = r.findIndex(x => x[2]) + 1, total = e.vis.reduce((a, b) => a + b, 0) || 1, me = e.vis[0];
  const t = e.trend, max = Math.max(...t, 10) * 1.3, mo = ['июн','июл','авг','сен','окт','ноя'], pts = t.map((v, i) => [20 + i * 56, 118 - v / max * 100]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1].toFixed(1)).join(' '), g = gaps();
  return `<div class="head"><div><h1>Обзор</h1><p>${esc(st.niche)} · ${esc(st.city)} · ${data.qs.length} вопросов</p></div>${segHtml()}</div>
  <div class="kpis"><div class="kpi main"><small>Видимость</small><b>${me}%</b><span>названы в ${e.grid.filter(x => x[0]).length} ответах из ${data.qs.length}</span></div>
  <div class="kpi"><small>Место</small><b>${place} из ${r.length}</b><span>среди отслеживаемых</span></div>
  <div class="kpi"><small>Доля упоминаний</small><b>${Math.round(me / total * 100)}%</b><span>от всех в нише</span></div>
  <div class="kpi"><small>Ссылок на ваш сайт</small><b>${e.cites}</b><span>в ответах нейросети</span></div></div>
  <div class="cols"><div class="box"><h4>Кого называет нейросеть <small>доля ответов</small></h4>${r.map(x => `<div class="row${x[2] ? ' me' : ''}"><span>${esc(x[0])}</span><u><i style="width:${x[1]}%"></i></u><em>${x[1]}%</em></div>`).join('')}</div>
  <div class="box"><h4>Ваша видимость <small>6 месяцев</small></h4><svg class="trend" viewBox="0 0 320 150" preserveAspectRatio="none" role="img" aria-label="График видимости"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2355ff" stop-opacity=".22"/><stop offset="1" stop-color="#2355ff" stop-opacity="0"/></linearGradient></defs><path d="${line} L${pts[5][0]} 118 L${pts[0][0]} 118 Z" fill="url(#g)"/><path d="${line}" fill="none" stroke="#2355ff" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1].toFixed(1)}" r="3.5" fill="#fff" stroke="#2355ff" stroke-width="2"/><text x="${p[0]}" y="${(p[1] - 10).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b1437">${t[i]}%</text><text x="${p[0]}" y="140" text-anchor="middle" font-size="10.5" fill="#5d6785">${mo[i]}</text>`).join('')}</svg></div></div>
  <div class="cols eq"><div class="box"><h4>Где вас не называют <small><a href="#/questions" style="color:var(--blue);font-weight:700">все вопросы</a></small></h4>${g.length ? g.slice(0, 3).map(x => `<div class="q" style="padding:9px 0">${esc(x.q)}<small>вместо вас: <b>${esc(x.who.join(', '))}</b></small></div>`).join('') : '<p class="muted">Таких вопросов нет.</p>'}</div>
  <div class="box"><h4>Что сделать сначала <small><a href="#/tasks" style="color:var(--blue);font-weight:700">все задачи</a></small></h4>${tasks().slice(0, 2).map(t => `<div class="q" style="padding:9px 0"><b>${esc(t.t)}</b><small>${esc(t.d)}</small></div>`).join('')}</div></div>`;
}
function viewQuestions(){
  return `<div class="head"><div><h1>Вопросы</h1><p>Что спрашивают клиенты и называет ли вас нейросеть</p></div></div>
  <div class="box"><div class="tw"><table><tr><th>Вопрос</th>${ENGINES.map(e => `<th class="c">${e[1]}</th>`).join('')}<th>Кого называют вместо вас</th></tr>
  ${data.qs.map((q, qi) => `<tr><td>${esc(q)}</td>${ENGINES.map(([id]) => `<td class="c"><span class="dot${data.eng[id].grid[qi][0] ? ' y' : ''}" title="${data.eng[id].grid[qi][0] ? 'называет' : 'не называет'}"></span></td>`).join('')}<td class="muted">${esc(data.names.filter((n, i) => i > 0 && ENGINES.some(([id]) => data.eng[id].grid[qi][i])).join(', ') || '—')}</td></tr>`).join('')}</table></div>
  <form class="add" id="addq"><input class="inp" maxlength="120" placeholder="Добавить свой вопрос" aria-label="Свой вопрос" required><button class="btn btn-blue">Добавить</button></form>
  <p class="muted" style="font-size:13px;margin-top:10px">Зелёная точка — нейросеть назвала вашу компанию в ответе на этот вопрос.</p></div>`;
}
function viewRivals(){
  return `<div class="head"><div><h1>Конкуренты</h1><p>Видимость по каждой нейросети</p></div></div>
  <div class="box"><div class="tw"><table><tr><th>Компания</th>${ENGINES.map(e => `<th class="n">${e[1]}</th>`).join('')}<th class="n">В среднем</th></tr>
  ${data.names.map((n, i) => { const v = ENGINES.map(([id]) => data.eng[id].vis[i]); return [n, v, Math.round(v.reduce((a, b) => a + b, 0) / v.length), i === 0] }).sort((a, b) => b[2] - a[2]).map(x => `<tr class="${x[3] ? 'me' : ''}"><td>${esc(x[0])}${x[3] ? ' · вы' : ''}</td>${x[1].map(v => `<td class="n">${v}%</td>`).join('')}<td class="n">${x[2]}%</td></tr>`).join('')}</table></div>
  <p class="muted" style="font-size:13px;margin-top:12px">Список конкурентов меняется в <a href="#/settings" style="color:var(--blue);font-weight:700">настройках</a>.</p></div>`;
}
function viewSources(){
  const e = E(), max = e.src[0][1];
  return `<div class="head"><div><h1>Источники</h1><p>На какие сайты ссылается нейросеть, отвечая про вашу нишу</p></div>${segHtml()}</div>
  <div class="cols"><div class="box"><h4>Сайты <small>ссылок в ответах</small></h4>${e.src.map(s => `<div class="row"><span>${esc(s[0])}</span><u><i style="width:${s[1] / max * 100}%;background:var(--blue)"></i></u><em>${s[1]}</em></div>`).join('')}</div>
  <div class="box"><h4>Как о вас говорят</h4><div style="display:flex;height:10px;border-radius:99px;overflow:hidden;margin:4px 0 12px"><i style="width:${e.tone[0]}%;background:var(--good)"></i><i style="width:${e.tone[1]}%;background:#c3cbe0"></i><i style="width:${e.tone[2]}%;background:var(--bad)"></i></div>
  <p class="muted" style="font-size:13.5px">Хорошо ${e.tone[0]}% · нейтрально ${e.tone[1]}% · плохо ${e.tone[2]}%</p><p style="font-size:14px;margin-top:14px">Чем больше о вас написано на сайтах слева, тем чаще нейросеть вас называет. Начните с первого в списке.</p></div></div>`;
}
function tasks(){
  const top = E().src[0][0], g = gaps()[0], lead = ranked().find(x => !x[2]);
  return [
    { id: 'faq', t: 'Добавить на сайт страницу с ответами на вопросы клиентов', d: g ? `Нейросеть не называет вас на вопрос «${g.q}». Ей не из чего взять ответ.` : 'Так нейросети проще найти факты о вас.', ai: 'faq' },
    { id: 'src', t: `Обновить карточку и собрать отзывы на ${top}`, d: 'Отсюда нейросеть берёт больше всего ответов в вашей нише.', ai: 'review' },
    { id: 'ig', t: 'Переписать описание профиля в Instagram', d: 'В описании должно быть прямо сказано, чем вы занимаетесь и в каком городе.', ai: 'bio' },
    { id: 'cmp', t: lead ? `Сделать страницу «Чем мы отличаемся от ${lead[0]}»` : 'Сделать страницу с вашими отличиями', d: 'На вопросы со сравнением нейросеть отвечает по таким страницам.', ai: 'compare' },
    { id: 'nap', t: 'Проверить адрес, телефон и часы работы на всех площадках', d: 'Если данные расходятся, нейросеть может назвать устаревшие.', ai: null }
  ];
}
function viewTasks(){
  return `<div class="head"><div><h1>Что сделать</h1><p>Действия, которые повышают шанс, что нейросеть вас назовёт</p></div></div>
  <div class="box">${tasks().map(t => `<div class="task${st.done[t.id] ? ' done' : ''}"><input type="checkbox" data-task="${t.id}" ${st.done[t.id] ? 'checked' : ''} aria-label="Готово"><div><h4>${esc(t.t)}</h4><p>${esc(t.d)}</p>${t.ai ? `<button class="btn btn-sm" data-ai="${t.ai}">Сделать с помощником</button>` : ''}</div></div>`).join('')}</div>
  <div class="agency"><div><h2>Нет времени делать самим?</h2><p>Агентство Kenes AI выполнит эти задачи за вас и запустит рекламу в ChatGPT.</p></div><a class="btn btn-blue" href="https://kenesai.asia/#lead">Позвать агентство</a></div>`;
}
function viewConnectors(){
  return `<div class="head"><div><h1>Подключения</h1><p>Подключите площадки, чтобы Körin видел то же, что и нейросети</p></div></div>
  <div class="banner">Демо-режим. Кнопки переключают статус, но настоящего входа в Instagram, Facebook и другие сервисы пока нет.</div>
  <div class="conns">${CONNECTORS.map(c => `<div class="conn"><div class="ic">${c[1]}</div><div><h4>${c[2]} ${st.conn[c[0]] ? '<span class="pill ok">подключено · демо</span>' : ''}</h4><p>${c[3]}</p><button class="btn btn-sm${st.conn[c[0]] ? '' : ' btn-blue'}" data-conn="${c[0]}">${st.conn[c[0]] ? 'Отключить' : 'Подключить'}</button></div></div>`).join('')}</div>`;
}
function viewSettings(){
  return `<div class="head"><div><h1>Настройки</h1><p>Компания и конкуренты</p></div></div>
  <div class="cols eq"><div class="box"><h4>Компания</h4><p><b>${esc(st.company)}</b></p><p class="muted">${esc(st.niche)} · ${esc(st.city)}</p>
  <h4 style="margin-top:20px">Конкуренты</h4><div class="chips">${st.rivals.map((r, i) => `<span>${esc(r)}${st.rivals.length > 1 ? `<button data-delr="${i}" aria-label="Убрать">×</button>` : ''}</span>`).join('')}</div>
  <form class="add" id="addrv"><input class="inp" maxlength="40" placeholder="Добавить конкурента" aria-label="Конкурент" required><button class="btn">Добавить</button></form></div>
  <div class="box"><h4>Тариф</h4><p><b>Демо</b> <span class="pill demo">данные условные</span></p><p class="muted" style="margin-top:6px">Настоящие ответы нейросетей появятся после запуска сервиса.</p>
  <h4 style="margin-top:20px">Начать заново</h4><p class="muted" style="margin-bottom:10px">Удалит компанию и конкурентов из этого браузера.</p><button class="btn" id="reset">Сбросить демо</button></div></div>`;
}
const VIEWS = { overview: viewOverview, questions: viewQuestions, rivals: viewRivals, sources: viewSources, tasks: viewTasks, connectors: viewConnectors, settings: viewSettings };

function app(){
  const route = (location.hash.replace('#/', '') || 'overview'), cur = VIEWS[route] ? route : 'overview';
  $('#root').innerHTML = `<div class="shell"><div class="topbar"><a class="logo" href="../"><i></i>Körin</a><span class="co">${esc(st.company)}</span><span class="pill demo">демо</span><span class="sp"></span></div>
  <nav class="nav" aria-label="Разделы"><b>Кабинет</b>${NAV.map(([id, n]) => `<a href="#/${id}" class="${id === cur ? 'on' : ''}">${n}</a>`).join('')}<div class="help">Не получается разобраться? <a href="https://kenesai.asia/#lead">Позвать агентство</a></div></nav>
  <main>${VIEWS[cur]()}</main></div>
  <button class="btn btn-blue fab" id="fab">Помощник</button>
  <div class="drawer" id="drawer" role="dialog" aria-label="Помощник"><div class="dh">Помощник Körin <span class="pill demo">демо</span><button id="dclose" aria-label="Закрыть">×</button></div><div class="db" id="db"></div>
  <div class="quick" id="quick"></div><form class="df" id="dform"><input class="inp" id="dinp" placeholder="Спросите про свою видимость" aria-label="Сообщение"><button class="btn btn-blue">→</button></form></div>`;
  bind();
}
function bind(){
  $$('[data-eng]').forEach(b => b.onclick = () => { engine = b.dataset.eng; app() });
  $$('[data-task]').forEach(c => c.onchange = () => { st.done[c.dataset.task] = c.checked; store.save(st); app() });
  $$('[data-conn]').forEach(b => b.onclick = () => { st.conn[b.dataset.conn] = !st.conn[b.dataset.conn]; store.save(st); app() });
  $$('[data-delr]').forEach(b => b.onclick = () => { st.rivals.splice(+b.dataset.delr, 1); store.save(st); data = build(st); app() });
  $$('[data-ai]').forEach(b => b.onclick = () => { openDrawer(); ask(AI[b.dataset.ai].q) });
  const aq = $('#addq'); if (aq) aq.onsubmit = e => { e.preventDefault(); const v = aq.querySelector('input').value.trim(); if (!v || data.qs.includes(v)) return; st.custom.push(v); store.save(st); data = build(st); app() };
  const ar = $('#addrv'); if (ar) ar.onsubmit = e => { e.preventDefault(); const v = ar.querySelector('input').value.trim(); if (!v || st.rivals.length >= 5 || [st.company, ...st.rivals].some(x => x.toLowerCase() === v.toLowerCase())) return; st.rivals.push(v); store.save(st); data = build(st); app() };
  const rs = $('#reset'); if (rs) rs.onclick = () => { store.clear(); location.href = location.pathname };
  $('#fab').onclick = openDrawer; $('#dclose').onclick = () => $('#drawer').classList.remove('open');
  $('#dform').onsubmit = e => { e.preventDefault(); const v = $('#dinp').value.trim(); if (v) { $('#dinp').value = ''; ask(v) } };
  $('#quick').innerHTML = Object.values(AI).map(a => `<button type="button">${esc(a.q)}</button>`).join('');
  $$('#quick button').forEach(b => b.onclick = () => ask(b.textContent));
}

/* Помощник: готовые шаблоны, подставляющие данные кабинета. Настоящей нейросети здесь нет. */
const AI = {
  why: { q: 'Почему нас не называют?', a: () => { const g = gaps()[0], r = ranked().find(x => !x[2]); return g ? `Самый показательный вопрос: «${g.q}». В ответе названы ${g.who.join(', ')}, а вас нет.\n\nЧаще всех в нише называют ${r[0]} — ${r[1]}%. У вас ${E().vis[0]}%.\n\nБольше всего ответов нейросеть берёт с ${E().src[0][0]}. Начните с карточки и отзывов там.` : 'В этой проверке нет вопросов, где конкурентов называют, а вас нет.' } },
  faq: { q: 'Напиши ответы на вопросы для сайта', a: () => `Черновик для страницы «Вопросы и ответы»:\n\n1. Чем занимается ${st.company}?\n${st.company} — ${st.niche} в городе ${st.city}. [добавьте, сколько лет работаете и для кого]\n\n2. Сколько это стоит?\n[впишите цены или диапазон — нейросеть называет компании, у которых цены указаны]\n\n3. Где вы находитесь и как записаться?\n[адрес, телефон, часы работы]\n\nКвадратные скобки заполните своими фактами.` },
  review: { q: 'Как попросить клиентов оставить отзыв', a: () => `Сообщение клиенту:\n\n«Здравствуйте! Спасибо, что выбрали ${st.company}. Если вам всё понравилось, оставьте, пожалуйста, короткий отзыв на ${E().src[0][0]} — это занимает минуту и очень нам помогает. [ссылка на карточку]»\n\nОтправляйте сразу после оказания услуги.` },
  bio: { q: 'Перепиши описание для Instagram', a: () => `Вариант описания профиля:\n\n${st.company} · ${st.niche}\n📍 ${st.city}, [адрес]\n[главное отличие в 4–6 словах]\nЗапись: [телефон или ссылка]\n\nВажно, чтобы ниша и город были написаны словами, а не только в хэштегах.` },
  compare: { q: 'Чем мы отличаемся от лидера', a: () => { const r = ranked().find(x => !x[2]); return `План страницы «${st.company} и ${r[0]}: в чём разница»:\n\n1. Для кого подходим мы, для кого они.\n2. Цены и что входит.\n3. Чем мы объективно отличаемся: [3 факта].\n4. Отзывы клиентов.\n\nПишите только проверяемые факты и без оценок конкурента.` } }
};
function openDrawer(){ $('#drawer').classList.add('open'); if (!$('#db').children.length) say(`Здравствуйте! Я вижу данные кабинета «${st.company}» и могу объяснить цифры или подготовить текст. Это демо: ответы собраны по шаблонам.`) }
function say(t, u){ const d = document.createElement('div'); d.className = 'm' + (u ? ' u' : ''); d.textContent = t; $('#db').appendChild(d); $('#db').scrollTop = $('#db').scrollHeight }
function ask(q){
  say(q, true); const s = q.toLowerCase();
  const k = Object.keys(AI).find(k => AI[k].q === q) || (/почему|не назыв/.test(s) ? 'why' : /faq|вопрос|сайт/.test(s) ? 'faq' : /отзыв/.test(s) ? 'review' : /инст|описан|bio/.test(s) ? 'bio' : /отлич|сравн|лидер|конкурент/.test(s) ? 'compare' : null);
  setTimeout(() => say(k ? AI[k].a() : 'В демо я отвечаю на пять тем: почему вас не называют, ответы на вопросы для сайта, отзывы, описание для Instagram и отличия от лидера. Выберите одну из кнопок ниже.'), 400);
}

addEventListener('hashchange', () => { if (st.ready) app() });
st.ready ? app() : onboarding();
</script>
</body>
</html>
