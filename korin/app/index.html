<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Körin — кабинет</title>
<meta name="robots" content="noindex">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('korin-theme-v4')||'dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--side:#fafafa;--card:#fff;--sub:#f6f6f7;--line:#ebebee;--line2:#dcdce0;--ink:#0f1114;--text:#2a2d33;--muted:#6f737b;--dim:#9a9ea6;--acc:#2f5bff;--acc-bg:#eef2ff;--lime:#8b9cff;--lime-ink:#1c2600;--ok:#0f7b4f;--ok-bg:#e6f6ee;--bad:#c2331f;--bad-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fff5db;--btn:#0f1114;--btn-ink:#fff;--hero:linear-gradient(135deg,#f3f6ff,#fff 60%);--shadow:0 1px 2px rgba(15,17,20,.04),0 8px 24px -12px rgba(15,17,20,.12);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
[data-theme=dark]{--bg:#0b0c0e;--side:#0f1012;--card:#121316;--sub:#17181b;--line:#222428;--line2:#2f3237;--ink:#f7f8f8;--text:#d5d7db;--muted:#8a8f98;--dim:#62666d;--acc:#7aa2ff;--acc-bg:rgba(91,140,255,.14);--ok:#7ee0a8;--ok-bg:rgba(60,200,130,.14);--bad:#ff9d93;--bad-bg:rgba(255,107,94,.14);--warn:#f5c56b;--warn-bg:rgba(245,197,107,.13);--btn:#fff;--btn-ink:#0b0c0e;--hero:radial-gradient(120% 160% at 0 0,rgba(91,140,255,.2),transparent 60%),#15161a;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
h1,h2,h3,h4,p{margin:0;color:var(--ink)}
p{color:inherit}
h1{font-size:22px;letter-spacing:-.025em;font-weight:600;line-height:1.2}
h2{font-size:15px;letter-spacing:-.01em;font-weight:600}
h4{font-size:14.5px;font-weight:600}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:7px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sub)}
.btn-p{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}.btn-p:hover{background:var(--btn);opacity:.88}
.btn-lg{height:42px;padding:0 16px;font-size:14.5px;border-radius:10px}
.ib{width:34px;padding:0}
.muted{color:var(--muted)}
.mono{font:400 12px var(--mono);color:var(--muted)}
.mark{background:var(--lime);color:var(--lime-ink);border-radius:4px;padding:0 5px;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:6px;padding:2px 8px;white-space:nowrap;background:var(--sub);color:var(--muted);border:1px solid var(--line)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.tag.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.tag.acc{background:var(--acc-bg);color:var(--acc);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}.dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}

.shell{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.content{min-width:0}
.head>div{min-width:0}
.top{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-width:0}
.crumb b{color:var(--ink);font-weight:600;white-space:nowrap}
.crumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.02em;color:var(--ink)}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.logo i::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime)}
.side{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;font-size:11px;font-weight:500;color:var(--muted)}
.tabs a.on{color:var(--ink)}.tabs a.on svg{color:var(--acc)}
main{padding:18px 14px 96px;min-width:0;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px}
.head p{color:var(--muted);font-size:14px;margin-top:3px}
.seg{display:flex;background:var(--sub);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;overflow-x:auto;max-width:100%}
.seg button,.seg a{border:0;background:none;border-radius:7px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg [aria-pressed=true],.seg a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,17,20,.12)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 13px;font-size:13.5px;margin-bottom:14px}

.hero{background:var(--hero);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px;box-shadow:var(--shadow)}
.hero small{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.frac{font:600 clamp(42px,10vw,60px)/1 var(--sans);letter-spacing:-.05em;color:var(--ink);margin-top:8px}
.frac span{font-size:.3em;font-weight:400;color:var(--muted);letter-spacing:-.01em;margin-left:10px}
.hero .diag{font-size:16px;line-height:1.5;color:var(--text)}
.grid{display:grid;gap:12px;margin-top:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.box>h2{margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.box>h2 a{font-size:13px;font-weight:500;color:var(--acc)}
.rowi{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rowi:first-of-type{border-top:0;padding-top:0}
.rowi p{font-size:13px;color:var(--muted)}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--sub);border:1px solid var(--line);color:var(--ink)}
.rank{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.rank span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank u{display:block;height:6px;border-radius:9px;background:var(--sub);overflow:hidden}
.rank i{display:block;height:100%;border-radius:9px;background:var(--line2)}
.rank.me i{background:var(--acc)}.rank.me span:first-child{font-weight:600;color:var(--ink)}
.rank em{font:400 12px var(--mono);font-style:normal;color:var(--muted)}
.qrow{display:grid;gap:7px;padding:12px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0;padding-top:0}
.qrow>b{font-weight:500;color:var(--ink)}
.qrow .who{font-size:13px;color:var(--muted)}.qrow .who b{color:var(--bad);font-weight:500}
.dots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lnk{border:0;background:none;padding:0;color:var(--acc);font-weight:500;font-size:13px}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:500 12px var(--sans);color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}td.n{font:500 12.5px var(--mono)}
tr.me td{background:var(--acc-bg);font-weight:600;color:var(--ink)}
.inp{height:38px;border-radius:9px;border:1px solid var(--line2);background:var(--card);padding:0 12px;width:100%;font-size:14.5px}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}
.add{display:flex;gap:8px}
.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:13px;font-weight:500;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{display:inline-flex;align-items:center;gap:6px;background:var(--sub);border:1px solid var(--line);font-size:13px;border-radius:999px;padding:4px 6px 4px 11px}
.chips button{border:0;background:var(--line2);color:var(--ink);width:18px;height:18px;border-radius:50%;line-height:1;font-size:12px;padding:0}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:16px;font-size:14px;color:var(--muted);display:grid;gap:8px;justify-items:start}

/* agents & connectors */
.cards{display:grid;gap:12px}
.agent{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;transition:border-color .15s,box-shadow .15s}
.agent:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.agent header{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center}
.agent .av{width:40px;height:40px;border-radius:11px;background:var(--acc-bg);border-color:transparent;color:var(--acc)}
.agent p{font-size:13.5px;color:var(--muted)}
.agent footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.needs{display:flex;flex-wrap:wrap;gap:6px}
.sw{position:relative;width:36px;height:20px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:background .15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+i{background:#22c55e}.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
.conn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;transition:border-color .15s}
.conn:hover{border-color:var(--line2)}
.conn p{font-size:13px;color:var(--muted);margin:2px 0 10px}
.lg{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font:700 13px var(--sans);letter-spacing:-.02em}
.lg svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cat{font:500 12px var(--sans);color:var(--muted);margin:20px 0 10px;letter-spacing:.01em}
.cat:first-of-type{margin-top:0}
.log{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.log:first-of-type{border-top:0}

.onb{max-width:520px;margin:6vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;box-shadow:var(--shadow)}
.onb h1{font-size:24px}
.onb .st{display:flex;gap:6px;margin-bottom:22px}.onb .st i{flex:1;height:3px;border-radius:9px;background:var(--line)}.onb .st i.on{background:var(--ink)}
.onb .acts{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.prog{height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin:18px 0 10px}.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .5s}

.scrim{position:fixed;inset:0;background:rgba(10,12,16,.4);z-index:39;display:none}.scrim.open{display:block}
.drawer{position:fixed;z-index:40;inset:auto 0 0 0;max-height:88dvh;background:var(--card);border-radius:16px 16px 0 0;display:none;flex-direction:column;box-shadow:var(--shadow)}
.drawer.open{display:flex}
.dh{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.dh h2{flex:1;font-size:16px}
.db{overflow-y:auto;padding:16px;display:grid;gap:12px}
.ans{background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:13px;white-space:pre-wrap;font-size:14px;line-height:1.55;color:var(--text)}
.ans b{font-weight:600;color:var(--ink)}
.df{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.df:empty{display:none}

.box,.agent,.conn,.conn>div,.agent header>div,.rowi>div,.cards,.grid,.hero>*{min-width:0}
.add .inp{min-width:0}
.conn .btn,.side .help .btn{white-space:normal;height:auto;min-height:34px;padding:6px 12px;text-align:left}
.agent h4,.conn h4{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (max-width:639px){.rowi>.btn{grid-column:2;justify-self:start}.agent footer .btn{width:100%}}
@media (min-width:640px){.onb{padding:32px}.two{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){
  .shell{grid-template-columns:236px minmax(0,1fr)}
  .top{padding:0 24px}
  .top .logo{display:none}
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:1px;padding:12px 10px;border-right:1px solid var(--line);background:var(--side);position:sticky;top:0;height:100vh;overflow-y:auto}
  .ws{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;margin-bottom:8px}
  .ws b{display:block;font-size:14px;font-weight:600;color:var(--ink);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ws small{font-size:12px;color:var(--muted)}
  .side h5{margin:14px 8px 4px;font:500 11.5px var(--sans);color:var(--dim);letter-spacing:.02em}
  .side a.n{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:7px;font-weight:500;font-size:13.5px;color:var(--muted)}
  .side a.n:hover{background:var(--sub);color:var(--ink)}
  .side a.n.on{background:var(--line);color:var(--ink)}
  .side a.n em{margin-left:auto;font:500 11.5px var(--mono);font-style:normal;color:var(--dim)}
  .side .help{margin-top:auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;font-size:13px;color:var(--muted);display:grid;gap:8px}
  .content{min-width:0;display:grid;grid-template-rows:auto 1fr}
  main{padding:24px 28px 60px}
  .hero{grid-template-columns:auto 1fr auto;align-items:center;gap:32px;padding:24px 26px}
  .work{grid-template-columns:7fr 5fr}
  .cards{grid-template-columns:repeat(3,1fr)}
  .drawer{inset:0 0 0 auto;width:480px;max-height:none;border-radius:0;border-left:1px solid var(--line)}
}

/* ---------- galactic layer ---------- */
:root{--bg:#f5f6ff;--side:rgba(255,255,255,.55);--card:rgba(255,255,255,.7);--sub:rgba(99,102,241,.07);--line:rgba(80,90,170,.14);--line2:rgba(80,90,170,.26);--ink:#0b0e26;--text:#2c3154;--muted:#6a7096;--dim:#9aa0c2;--acc:#5b54f0;--acc-bg:rgba(99,102,241,.1);--lime:rgba(91,84,240,.14);--lime-ink:#3a2fd0;--btn:#0b0e26;--btn-ink:#fff;--hero:linear-gradient(135deg,rgba(124,92,255,.16),rgba(76,201,255,.14));--g:linear-gradient(120deg,#7c5cff,#4c8dff 55%,#22c7ee);--glow:rgba(124,92,255,.35);--head:"Unbounded","Inter",system-ui,sans-serif;--shadow:0 1px 2px rgba(40,40,120,.05),0 16px 40px -20px rgba(60,60,160,.3)}
[data-theme=dark]{--bg:#05060f;--side:rgba(8,10,24,.55);--card:rgba(255,255,255,.04);--sub:rgba(255,255,255,.055);--line:rgba(150,160,255,.13);--line2:rgba(150,160,255,.24);--ink:#f5f6ff;--text:#c8cdee;--muted:#8b91b8;--dim:#5d638a;--acc:#a79bff;--acc-bg:rgba(124,92,255,.18);--lime:rgba(76,201,255,.16);--lime-ink:#9fe9ff;--btn:#fff;--btn-ink:#05060f;--hero:linear-gradient(135deg,rgba(124,92,255,.24),rgba(34,199,238,.07));--glow:rgba(124,92,255,.55);--shadow:0 1px 2px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.9)}
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(48% 42% at 82% 0,rgba(124,92,255,.28),transparent 70%),radial-gradient(40% 36% at 8% 12%,rgba(34,199,238,.18),transparent 70%),radial-gradient(50% 40% at 50% 110%,rgba(76,141,255,.2),transparent 70%)}
[data-theme=dark] body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.7;background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 34% 62%,#cfd6ff,transparent),radial-gradient(1.2px 1.2px at 58% 28%,#fff,transparent),radial-gradient(1px 1px at 76% 74%,#bfe9ff,transparent),radial-gradient(1px 1px at 90% 40%,#fff,transparent),radial-gradient(1.2px 1.2px at 22% 86%,#d9d2ff,transparent),radial-gradient(1px 1px at 66% 92%,#fff,transparent),radial-gradient(1px 1px at 46% 8%,#fff,transparent);background-size:520px 520px}
h1,h2,.frac,.logo,.ws b,.onb h1{font-family:var(--head)}
h1{font-size:19px;font-weight:500;letter-spacing:-.02em}
h2{font-size:12.5px;font-weight:500;letter-spacing:0}
.onb h1{font-size:21px;line-height:1.3}
.top{background:transparent;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.side{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.box,.agent,.conn,.hero,.onb,.drawer{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px}
.drawer{background:color-mix(in srgb,var(--bg) 88%,transparent)}
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-90px;top:50%;width:360px;height:360px;transform:translateY(-50%);border-radius:50%;pointer-events:none;border:1px solid var(--line2);box-shadow:0 0 0 46px transparent,0 0 0 47px var(--line),0 0 0 100px transparent,0 0 0 101px var(--line);opacity:.8}
.hero>*{position:relative;z-index:1}
.frac{font-weight:500;letter-spacing:-.04em;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.frac span{-webkit-text-fill-color:var(--muted);font-family:var(--sans)}
.btn{border-radius:10px;backdrop-filter:blur(8px)}
.btn-p{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 8px 22px -10px var(--glow)}
.btn-p:hover{background:var(--g);opacity:1;filter:brightness(1.1)}
.mark{background:var(--lime);color:var(--lime-ink);border-radius:6px;padding:1px 7px}
.rank.me i,.prog i{background:var(--g)}
.onb .st i.on{background:var(--g)}
.side a.n.on{background:var(--acc-bg);color:var(--ink)}.side a.n.on svg{color:var(--acc)}
.av{background:var(--acc-bg);border-color:transparent;color:var(--acc)}
.agent .av{background:var(--g);color:#fff;box-shadow:0 8px 20px -10px var(--glow)}
.sw input:checked+i{background:var(--g)}
.dot.on{background:#4cc9ff;box-shadow:0 0 0 3px rgba(76,201,255,.2),0 0 12px #4cc9ff}
.logo i{background:var(--g);box-shadow:0 0 16px var(--glow)}.logo i::before{background:#fff}
.lg{border-radius:11px;box-shadow:0 6px 16px -8px rgba(20,20,80,.45);font:700 11px var(--sans);letter-spacing:-.02em}
.lg.real svg{stroke:none;width:22px;height:22px}
.lg.own{background:var(--acc-bg);box-shadow:none}.lg.own svg{stroke:var(--acc)}
.lg.lite{border:1px solid var(--line)}
.note{border:1px solid var(--line);backdrop-filter:blur(12px)}
.seg{backdrop-filter:blur(8px)}

/* ---------- Overview: numbers and verdict ---------- */
.head{margin-bottom:20px}
.head h1{font-size:26px;font-weight:500;letter-spacing:-.03em;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.head p{margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0;display:grid;gap:8px;align-content:start;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.kpi small{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi b{font:500 34px/1 var(--head);letter-spacing:-.04em;color:var(--ink)}
.kpi b span{font:400 14px var(--sans);letter-spacing:0;color:var(--muted);margin-left:8px}
.kpi p{font-size:13px;color:var(--muted)}
.kpi a{font-size:13px;font-weight:500;color:var(--acc)}
.kpi:last-child{grid-column:1/-1}
.kpi.main{grid-column:1/-1;background:var(--hero);border-color:var(--line2);box-shadow:0 20px 60px -30px rgba(124,92,255,.8)}
.kpi.main::after{content:"";position:absolute;right:-70px;top:50%;width:220px;height:220px;transform:translateY(-50%);border-radius:50%;pointer-events:none;border:1px solid var(--line2);box-shadow:0 0 0 34px transparent,0 0 0 35px var(--line)}
.kpi.main>*{position:relative;z-index:1}
.kpi.main b{font-size:54px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi.main b span{-webkit-text-fill-color:var(--muted);font-size:15px}
.engs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.engs span{font-size:12.5px;font-weight:500;color:var(--text);background:var(--sub);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.say{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin-top:12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.say p{font-size:16px;line-height:1.5;color:var(--ink)}
.say .btn{grid-column:2;justify-self:start}
@media (min-width:1000px){
  .head h1{font-size:30px}
  .kpis{grid-template-columns:1.5fr 1fr 1fr 1fr}
  .kpi{padding:22px}
  .kpi.main,.kpi:last-child{grid-column:auto}
  .say{grid-template-columns:40px minmax(0,1fr) auto}
  .say .btn{grid-column:auto}
}

/* ---------- workspace without a sidebar ---------- */
.shell{display:block}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;border-bottom:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.bar .logo{font-size:17px}
.pill{display:none}
.whoami{display:none}
main{margin:0 auto;max-width:1120px;padding:20px 16px 110px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 2px 14px}
.sect h2{font-size:15px}
.sect a{font-size:13.5px;font-weight:500;color:var(--acc);white-space:nowrap}

/* orb: the face of an agent */
@keyframes osp{to{transform:rotate(360deg)}}
@keyframes obr{50%{transform:scale(1.06)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96);filter:blur(8px)}}
@keyframes ripple{from{transform:scale(.6);opacity:.9}to{transform:scale(1.5);opacity:0}}
.orb{--h:0deg;position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;filter:hue-rotate(var(--h));background:radial-gradient(circle at 30% 24%,#cfc4ff,#7c5cff 42%,#2a1f8f 78%,#120d45);box-shadow:0 0 26px -4px rgba(124,92,255,.85),inset 0 0 14px rgba(255,255,255,.28)}
.orb::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,#22c7ee 78%,#b9a8ff 96%,transparent);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));animation:osp 3.4s linear infinite}
.orb svg.i{width:20px;height:20px;stroke-width:1.8;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.orb.sm{width:30px;height:30px}.orb.sm::before{inset:-4px}.orb.sm svg.i{width:14px;height:14px}
.orb.xl{width:112px;height:112px;animation:obr 4.5s ease-in-out infinite}.orb.xl::before{inset:-12px;animation-duration:6s}.orb.xl svg.i{width:44px;height:44px;stroke-width:1.4}
.orb.off{filter:grayscale(.85) brightness(.7);box-shadow:none}.orb.off::before{animation:none;opacity:.3}
main.fx .in{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}

/* home */
.stage{position:relative;overflow:hidden;display:grid;gap:22px;justify-items:center;text-align:center;border:1px solid var(--line2);border-radius:26px;padding:34px 20px 26px;background:var(--hero);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px -40px rgba(124,92,255,.9)}
.core{position:relative;width:150px;height:150px;display:grid;place-items:center}
.core>i{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line2);animation:ripple 3.6s ease-out infinite}
.core>i+i{animation-delay:1.8s}
.stage small{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stage .frac{font-size:clamp(56px,13vw,84px);margin-top:10px}
.stage .frac b{font-weight:500}
.stage .diag{font-size:17px;line-height:1.5;color:var(--ink);margin-top:14px;max-width:560px}
.stage-b{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;margin-top:20px}
.stage-t{min-width:0;display:grid;justify-items:center}
.team{display:flex;gap:12px;overflow-x:auto;padding:10px 2px 14px;margin:-10px -2px 0;scroll-snap-type:x proximity}
.mate{flex:0 0 132px;scroll-snap-align:start;display:grid;justify-items:center;gap:10px;text-align:center;padding:20px 10px 16px;border:1px solid var(--line);border-radius:20px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .25s,border-color .25s,box-shadow .25s}
.mate:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 22px 50px -26px rgba(124,92,255,.95)}
.mate b{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.25}
.mate small{font-size:11.5px;color:var(--muted);line-height:1.3}
.sugs{display:grid;gap:12px}
.sug{position:relative;display:grid;gap:10px;align-content:start;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);min-width:0;transition:border-color .25s,box-shadow .25s}
.sug:hover{border-color:var(--line2);box-shadow:0 22px 50px -30px rgba(124,92,255,.9)}
.sug header{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}
.sug h4{font-size:16px;line-height:1.35}
.sug p{font-size:13.5px;color:var(--muted)}
.sug .btn{justify-self:start;margin-top:6px}
.cstrip{display:flex;flex-wrap:wrap;gap:10px}
.cchip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px 8px 8px;font-size:14px;font-weight:500;color:var(--ink);transition:border-color .2s,transform .2s}
.cchip:hover{border-color:var(--line2);transform:translateY(-2px)}
.cchip .lg{width:32px;height:32px;border-radius:9px}.cchip .lg svg{width:18px;height:18px}
.cchip small{font-size:12px;font-weight:400;color:var(--muted)}

/* agents page */
.agent{border-radius:22px;padding:20px;position:relative}
.agent header{grid-template-columns:46px 1fr auto;gap:16px}
.agent:hover{box-shadow:0 26px 60px -32px rgba(124,92,255,.95)}
.lead{font-size:16px;color:var(--muted);margin-top:8px;max-width:620px}
.head h1{font-size:26px}

/* an agent at work */
.think{display:grid;justify-items:center;gap:22px;padding:26px 0 10px;text-align:center}
.think .orb{width:84px;height:84px;animation:obr 1.4s ease-in-out infinite}.think .orb::before{inset:-10px;animation-duration:1.1s}.think .orb svg.i{width:32px;height:32px}
.think ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14.5px;color:var(--text);text-align:left}
.think li{display:flex;gap:10px;align-items:center;animation:rise .45s both}
.think li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 12px #7c5cff;flex:none}
.byline{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:640px){.sugs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){
  .bar{padding:0 28px;height:64px}
  .pill{display:flex;gap:2px;margin-left:22px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--sub)}
  .pill a{display:flex;align-items:center;gap:8px;height:34px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);transition:color .15s,background .15s}
  .pill a:hover{color:var(--ink)}
  .pill a.on{background:var(--g);color:#fff;box-shadow:0 8px 22px -10px var(--glow)}
  .pill em{font:500 11px var(--mono);font-style:normal;opacity:.75}
  .whoami{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);max-width:240px}
  .whoami b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding:30px 28px 70px}
  .stage{grid-template-columns:auto minmax(0,1fr);justify-items:start;text-align:left;gap:44px;padding:44px 52px}
  .stage-t{justify-items:start}
  .stage-b{justify-content:flex-start}
  .core{width:190px;height:190px}.orb.xl{width:136px;height:136px}
  .team{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:visible}
  .mate{flex:none}
  .head h1{font-size:32px}
}

/* ---------- agents: a working chat ---------- */
.desk{display:grid;gap:16px;min-width:0}
.roster{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;margin:-6px -2px 0;min-width:0}
.ro{flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .2s,background .2s}
.ro b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.ro small{display:none;font-size:12px;color:var(--muted)}
.ro:hover{border-color:var(--line2)}
.ro.on{border-color:transparent;background:var(--hero);box-shadow:inset 0 0 0 1px var(--line2),0 16px 40px -24px rgba(124,92,255,.9)}
.chat{display:flex;flex-direction:column;min-width:0;min-height:calc(100dvh - 260px)}
.ch{display:flex;align-items:center;gap:16px;padding:4px 2px 18px;border-bottom:1px solid var(--line)}
.ch>div{flex:1;min-width:0}
.ch h1{font-size:20px}
.ch p{font-size:13.5px;color:var(--muted);margin-top:4px}
.thread{flex:1;display:grid;gap:22px;align-content:start;padding:24px 0}
.hello{display:grid;justify-items:center;text-align:center;gap:14px;padding:5vh 0 2vh}
.hello .orb{width:92px;height:92px;animation:obr 4.5s ease-in-out infinite}.hello .orb::before{inset:-11px;animation-duration:6s}.hello .orb svg.i{width:36px;height:36px;stroke-width:1.5}
.hello h2{font-size:19px;margin-top:10px}
.hello p{max-width:440px;color:var(--muted);font-size:15px}
.msg{display:flex;gap:14px;min-width:0;animation:rise .45s both}
.msg.u{justify-content:flex-end}
.msg.u p{max-width:min(560px,86%);background:var(--g);color:#fff;border-radius:18px 18px 4px 18px;padding:11px 16px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 12px 30px -16px var(--glow)}
.msg.a .orb{margin-top:6px}
.bub{flex:1;min-width:0;max-width:720px;display:grid;gap:12px;border:1px solid var(--line);border-radius:4px 18px 18px 18px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:16px 18px}
.txt{font-size:15px;line-height:1.6;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.steps{list-style:none;margin:0;padding:0 0 12px;display:grid;gap:7px;font:400 12.5px var(--mono);color:var(--muted);border-bottom:1px dashed var(--line)}
.steps li{display:flex;gap:9px;align-items:baseline;animation:rise .4s both}
.steps li::before{content:"✓";color:#4cc9ff;flex:none}
.steps li.no::before{content:"!";color:var(--warn)}
.bub.live .steps{border:0;padding:0}
.dots3{display:flex;gap:5px;align-items:center;height:18px}
.dots3 i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:blink 1.2s infinite}
.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
.msg.a.work .orb{animation:obr 1.2s ease-in-out infinite}.msg.a.work .orb::before{animation-duration:1s}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meta .btn{height:30px;font-size:13px;padding:0 10px}
.chk{display:grid;gap:8px;font-size:14.5px}
.chk h4{font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
.chk div{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.chk small{display:block;font-size:12.5px;color:var(--muted)}
.asks{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:12px}
.asks button{border:1px solid var(--line2);background:var(--sub);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:500;text-align:left;transition:border-color .2s,transform .2s}
.asks button:hover{border-color:var(--acc);transform:translateY(-1px)}
.composer{position:sticky;bottom:74px;z-index:5;display:flex;gap:10px;align-items:flex-end;border:1px solid var(--line2);border-radius:20px;padding:10px 10px 10px 18px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 24px 60px -30px rgba(124,92,255,.95);transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-bg),0 24px 60px -30px rgba(124,92,255,.95)}
.composer textarea,.composer input{flex:1;min-width:0;border:0;background:none;outline:none;resize:none;font-size:15.5px;line-height:1.5;padding:7px 0;max-height:160px;color:var(--ink)}
.composer textarea::placeholder,.composer input::placeholder{color:var(--dim)}
.composer .btn{height:40px;border-radius:13px;flex:none}
.composer.home{position:static;margin-top:14px}
.stat{font:400 12px var(--mono);color:var(--muted);padding:10px 4px 0;display:flex;gap:8px;align-items:center}
@media (min-width:1000px){
  .desk{grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
  .roster{position:sticky;top:88px;flex-direction:column;overflow:visible;gap:4px;padding:0;margin:0}
  .ro{border-radius:16px;border-color:transparent;background:none;backdrop-filter:none;padding:10px 12px}
  .ro small{display:block;margin-top:2px}
  .ro:hover{background:var(--sub);border-color:transparent}
  .composer{bottom:18px}
  .chat{min-height:calc(100dvh - 130px)}
}

/* ---------- working cycle: overview, plan board, report ---------- */
.kpis{margin-top:12px}
.kpi:last-child{grid-column:auto}
.trend{display:grid;gap:8px}
.trend .rank{grid-template-columns:minmax(90px,150px) 1fr auto;margin:4px 0}
.rep{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;justify-content:space-between}
.rep p{color:var(--muted);font-size:14px;max-width:560px}
.kan{display:grid;gap:14px;align-items:start}
.kcol{border:1px solid var(--line);border-radius:20px;padding:14px;background:var(--panel,rgba(255,255,255,.02));min-width:0}
.kcol>h2{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 12px}
.kcol>h2 span{font:500 12px var(--mono);color:var(--muted)}
.kcard{border:1px solid var(--line);border-radius:16px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:14px;display:grid;gap:8px;margin-top:10px;min-width:0}
.kcard h4{font-size:14.5px;line-height:1.35}
.kcard p{font-size:13px;color:var(--muted)}
.kcard .meta .btn{height:30px;font-size:12.5px;padding:0 10px}
.kcol .none{font-size:13px;color:var(--dim);padding:10px 4px}
.kcol.done .kcard h4{color:var(--muted)}
.bar .hm{display:none}
@media (min-width:640px){.bar .hm{display:inline}}
@media (min-width:1000px){.kan{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- product panel: flat, neutral, one accent ---------- */
:root{--bg:#fafafa;--side:#fff;--card:#fff;--sub:#f4f4f5;--line:#e7e7e9;--line2:#d6d6d9;--ink:#111113;--text:#33343a;--muted:#6d6e76;--dim:#9a9ba3;--acc:#4f5bd5;--acc-bg:rgba(79,91,213,.1);--lime:rgba(79,91,213,.12);--lime-ink:#3944b8;--ok:#0f7b4f;--ok-bg:#e6f6ee;--bad:#c2331f;--bad-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fff5db;--btn:#111113;--btn-ink:#fff;--hero:#fff;--g:linear-gradient(#4f5bd5,#4f5bd5);--glow:transparent;--head:var(--sans);--shadow:0 12px 40px -16px rgba(0,0,0,.25)}
[data-theme=dark]{--bg:#0a0a0b;--side:#0a0a0b;--card:#111113;--sub:#19191c;--line:#222226;--line2:#33333a;--ink:#ededef;--text:#c7c7cc;--muted:#8b8b93;--dim:#5f5f67;--acc:#8b96ff;--acc-bg:rgba(139,150,255,.14);--lime:rgba(139,150,255,.18);--lime-ink:#c5caff;--ok:#6fd49b;--ok-bg:rgba(60,200,130,.13);--bad:#ff8f84;--bad-bg:rgba(255,107,94,.13);--warn:#e7b65a;--warn-bg:rgba(231,182,90,.12);--btn:#ededef;--btn-ink:#0a0a0b;--hero:#111113;--g:linear-gradient(#6f7cff,#6f7cff);--glow:transparent;--shadow:0 16px 50px -16px rgba(0,0,0,.8)}
body::before,[data-theme=dark] body::after,[data-theme=dark] body::before{display:none}
body{font-size:14px;line-height:1.5}
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
main.fx .in{animation-duration:.3s;animation-delay:0s}
h1,h2,.frac,.logo,.ws b,.onb h1,.kpi b{font-family:var(--sans)}
h1,.head h1,.ch h1{font-size:20px;font-weight:600;letter-spacing:-.02em;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink);width:auto}
h2,.sect h2{font-size:13.5px;font-weight:600;letter-spacing:0;color:var(--ink)}
h4{font-size:14px;font-weight:500}
.head{margin-bottom:18px;align-items:center}
.head p{font-size:13.5px;margin-top:3px}
.logo{font-weight:600;font-size:15px;letter-spacing:-.01em}
.logo i{width:20px;height:20px;border-radius:6px;background:var(--ink);box-shadow:none}
.logo i::before{background:var(--bg);border:0;width:6px;height:6px}
.bar{height:52px;background:var(--bg);border-bottom:1px solid var(--line)}
.pill{border:0;background:none;padding:0;gap:2px;margin-left:16px}
.pill a{height:30px;padding:0 11px;border-radius:7px;font-size:13.5px}

    `<button class="btn btn-p" id="csave">Сохранить</button>${connected(id) ? '<button class="btn" id="cdel">Отключить</button>' : ''}`);
  $('#csave').onclick = async () => { const v = $('#cl').value.trim(); if (!v) return $('#cl').focus(); st.conn[id] = v; st.cinfo = st.cinfo || {}; delete st.cinfo[id]; store.save(st);
    $('#csave').disabled = true; $('#csave').textContent = 'Открываю ссылку…';
    try { const d = await call('/api/connect', { url: v }); st.cinfo[id] = { ok: d.ok, status: d.status, title: d.title, chars: d.chars } } catch (e) { st.cinfo[id] = { err: e.message === 'Failed to fetch' ? 'сервер не ответил' : e.message } }
    store.save(st); closeDrawer(); render() };
  if ($('#cdel')) $('#cdel').onclick = () => { delete st.conn[id]; if (st.cinfo) delete st.cinfo[id]; store.save(st); closeDrawer(); render() };
  $('#cl').focus();
}
function openAnswer(qi){
  const marks = text => { let h = esc(text); data.names.forEach((n, i) => { h = h.split(esc(n)).join(i === 0 ? `<span class="mark">${esc(n)}</span>` : `<b>${esc(n)}</b>`) }); return h };
  drawer(data.qs[qi], data.engines.map(e => { const a = data.eng[e].answers[qi]; return `<div><p class="mono" style="margin-bottom:6px">${ENG[e]} · ${data.sample ? 'пример ответа, составлен для демонстрации' : esc(data.eng[e].model)} · ${data.eng[e].grid[qi][0] ? 'вас назвали' : 'вас не назвали'}</p><div class="ans">${a ? marks(a) : '<span class="muted">Текст ответа не сохранён.</span>'}</div></div>` }).join(''));
}
function drawer(title, html, foot){ $('#dtitle').textContent = title; $('#db').innerHTML = html; $('#df').innerHTML = foot || ''; $('#drawer').classList.add('open'); $('#scrim').classList.add('open') }
function closeDrawer(){ runSeq++; $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open') }

/* ---------- Каркас ---------- */
const themeBtn = wide => `<button class="btn${wide ? '' : ' ib'}" data-theme-toggle aria-label="Сменить тему">${ic(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon')}${wide ? (document.documentElement.dataset.theme === 'dark' ? 'Светлая тема' : 'Тёмная тема') : ''}</button>`;
function bindTheme(){ $$('[data-theme-toggle]').forEach(b => b.onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('korin-theme-v4', t) } catch (e) {} st.ready ? render() : onboarding() }) }
const NAV = [['Мониторинг', 'overview', 'home', 'Обзор'], ['Мониторинг', 'serp', 'list', 'Ответы'], ['Автоматизация', 'agents', 'bot', 'Агенты'], ['Автоматизация', 'tasks', 'check', 'Задачи'], ['Данные', 'connectors', 'plug', 'Подключения'], ['Данные', 'site', 'globe', 'Сайт для ИИ'], ['Данные', 'social', 'send', 'Соцсети'], ['Кабинет', 'settings', 'gear', 'Настройки']];
const VIEWS = { social: viewSocial, overview: viewOverview, agents: viewAgents, tasks: viewTasks, connectors: viewConnectors, site: viewSite, settings: viewSettings };
let lastRoute = '';
function render(){
  const [route = 'overview', sub] = location.hash.replace('#/', '').split('/');
  if (needReg() && NAV.some(n => n[1] === route) && !FREE.includes(route)) { const want = location.hash; history.replaceState(null, '', '#/overview'); regModal(want); return render() }
  const cur = NAV.some(n => n[1] === route) ? route : 'overview', title = NAV.find(n => n[1] === cur)[3];
  const view = cur === 'serp' ? viewSerp(['questions', 'rivals', 'sources'].includes(sub) ? sub : 'questions') : VIEWS[cur](sub);
  const badge = { agents: AGENTS.filter(a => agentOn(a[0])).length, connectors: CONNECTORS.filter(c => connected(c[1])).length || '', tasks: todos().filter(t => statOf(t.id) !== 'done').length };
  const tab = cur === 'serp' ? (['questions', 'rivals', 'sources'].includes(sub) ? sub : 'questions') : '';
  const top = [['overview', 'Обзор', cur === 'overview'], ['serp/questions', 'Вопросы', tab === 'questions'], ['serp/sources', 'Источники', tab === 'sources'], ['tasks', 'План', cur === 'tasks'], ['serp/rivals', 'Конкуренты', tab === 'rivals']];
  const mob = [['overview', 'home', 'Обзор', cur === 'overview'], ['serp/questions', 'list', 'Вопросы', tab === 'questions'], ['serp/sources', 'globe', 'Источники', tab === 'sources'], ['tasks', 'check', 'План', cur === 'tasks'], ['settings', 'more', 'Ещё', !['overview', 'tasks'].includes(cur) && !['questions', 'sources'].includes(tab)]];
  const enter = lastRoute !== cur; lastRoute = cur;

  const an = [['overview', 'home', 'Обзор', cur === 'overview'], ['serp/questions', 'list', 'Вопросы', tab === 'questions'], ['serp/sources', 'globe', 'Источники', tab === 'sources'], ['serp/rivals', 'chart', 'Конкуренты', tab === 'rivals'], ['tasks', 'check', 'План', cur === 'tasks']];
  const more = [['social', 'send', 'Соцсети'], ['connectors', 'plug', 'Подключения'], ['site', 'globe', 'Проверка сайта'], ['settings', 'gear', 'Настройки']];
  const recent = Object.keys(st.threads || {}).filter(k => (st.threads[k] || []).some(m => m.r === 'u')).slice(0, 5);
  const side = `<aside class="sb"><a class="wsw" href="#/settings"><i>${esc((st.company || 'K')[0].toUpperCase())}</i><b>${esc(st.company || 'Körin')}</b>${data.sample ? '<span class="tag warn">пример</span>' : ''}</a>
  <div class="seg sbm"><a href="#/overview" class="${asst ? '' : 'on'}">Аналитика</a><a href="#/agents" class="${asst ? 'on' : ''}">Помощник</a></div>
  <nav aria-label="Разделы">${asst ? TEAM.map(x => `<a class="sl${x[0] === selA ? ' on' : ''}" href="#/agents/${x[0]}">${ic(x[2])}<span>${x[1]}</span></a>`).join('') : an.map(n => `<a class="sl${n[3] ? ' on' : ''}" href="#/${n[0]}" ${n[3] ? 'aria-current="page"' : ''}>${ic(n[1])}<span>${n[2]}</span>${n[0] === 'tasks' && badge.tasks ? `<em>${badge.tasks}</em>` : ''}</a>`).join('') + '<h6>Данные</h6>' + more.map(n => `<a class="sl${cur === n[0] ? ' on' : ''}" href="#/${n[0]}">${ic(n[1])}<span>${n[2]}</span></a>`).join('')}
  ${recent.length ? `<h6>Последние</h6>${recent.map(k => { const x = TEAM.find(t => t[0] === k); return x ? `<a class="sl" href="#/agents/${k}">${ic(x[2])}<span>${esc(st.threads[k].find(m => m.r === 'u').text.slice(0, 40))}</span></a>` : '' }).join('')}` : ''}</nav>
  <div class="sbf"><a class="logo" href="../"><i></i>Körin</a>${themeBtn()}</div></aside>`;
  $('#root').innerHTML = `<div class="shell app">${side}<div style="min-width:0"><header class="bar"><a class="logo" href="../"><i></i>Körin</a><span class="sp"></span>${data.sample ? '<span class="tag warn">пример</span>' : ''}<a class="btn ib" href="#/agents" aria-label="Помощник">${ic('bot')}</a><a class="btn ib" href="#/settings" aria-label="Настройки">${ic('more')}</a>${themeBtn()}</header>
  <main class="${enter ? 'fx' : ''}" aria-label="${title}">${view}</main></div></div>
  <nav class="tabs" aria-label="Разделы">${mob.map(n => `<a href="#/${n[0]}" class="${n[3] ? 'on' : ''}">${ic(n[1])}<span>${n[2]}</span></a>`).join('')}</nav>`;
  if (enter && FX) $$('[data-count]').forEach(el => { const n = +el.dataset.count, t0 = performance.now(); const f = t => { const k = Math.min(1, (t - t0) / 800); el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f) }; requestAnimationFrame(f) });
  bindTheme();
  const cm = $('#composer');
  if (cm) { const q = $('#q'); cm.onsubmit = e => { e.preventDefault(); send(cm.dataset.id, q.value) }; q.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); cm.requestSubmit() } }; q.oninput = () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px' };
    $$('[data-ask]').forEach(b => b.onclick = () => send(cm.dataset.id, b.dataset.ask));
    $$('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(st.threads[cm.dataset.id][+b.dataset.copy].text); b.textContent = 'Скопировано' } catch (e) {} });
    $$('[data-clear]').forEach(b => b.onclick = () => { delete st.threads[b.dataset.clear]; store.save(st); render() });
    if ($('.msg')) scrollTo(0, document.body.scrollHeight);
    if (typeLast && FX) { const el = [...$$('.msg.a .txt')].pop(); if (el) { const html = el.innerHTML, text = el.textContent; let i = 0; const n = Math.max(2, Math.ceil(text.length / 70)); el.textContent = ''; const tm = setInterval(() => { i += n; if (i >= text.length || !el.isConnected) { clearInterval(tm); el.innerHTML = html } else el.textContent = text.slice(0, i) }, 16) } }
    typeLast = false }
  $$('[data-eng]').forEach(b => b.onclick = () => { engine = b.dataset.eng; render() });
  $$('[data-run]').forEach(b => b.onclick = () => runAgent(b.dataset.run));
  $$('[data-conn]').forEach(b => b.onclick = () => openConnector(b.dataset.conn));
  $$('[data-notify]').forEach(b => b.onclick = () => { st.notify[b.dataset.notify] = !st.notify[b.dataset.notify]; store.save(st); render() });
  $$('[data-agent]').forEach(c => c.onchange = () => { st.agents[c.dataset.agent] = c.checked; store.save(st); render() });
  $$('[data-ans]').forEach(b => b.onclick = () => openAnswer(+b.dataset.ans));
  $$('[data-move]').forEach(b => b.onclick = () => { const [id, k] = b.dataset.move.split(':'); st.stat = st.stat || {}; st.doneAt = st.doneAt || {}; st.stat[id] = k; st.done[id] = k === 'done'; if (k === 'done') st.doneAt[id] = Date.now(); store.save(st); render() });
  bindSocial();
  const rp = $('#report'); if (rp) rp.onclick = openReport;
  const wr = $('#whyRun'); if (wr) wr.onclick = e => { e.preventDefault(); runWhy() };
  $$('[data-gap]').forEach(b => b.onclick = () => { if (needReg()) return regModal(); const g = st.analysis.data.gaps[+b.dataset.gap]; st.custom = [{ id: 'gap' + st.analysis.at + b.dataset.gap, t: g.title, d: g.why + ' Первый шаг: ' + g.how }, ...(st.custom || [])].slice(0, 12); store.save(st); render() });
  const rs = $('#reset'); if (rs) rs.onclick = () => { store.clear(); location.href = location.pathname };
  const au = $('#audit'); if (au) au.onsubmit = async e => { e.preventDefault(); const v = au.querySelector('input').value.trim(); st.conn.site = v; store.save(st); const out = $('#auditOut');
    if (!API) { out.innerHTML = `<div class="empty">Сайт ${esc(v)} не проверялся: сервер Körin ещё не запущен. Адрес сохранён в подключениях.</div>`; return }
    out.innerHTML = '<div class="empty">Проверяем…</div>';
    try { const d = await call('/api/site-audit', { url: v }); out.innerHTML = `<p class="mono" style="margin-bottom:10px">проверено: ${esc(d.url)}</p><div class="grid two" style="margin-top:0"><div class="box"><h2>Доступ ботов</h2><div class="tw"><table>${d.bots.map(b => `<tr><td><b style="font-weight:500;color:var(--ink)">${esc(b.bot)}</b><div class="muted" style="font-size:13px">${esc(b.what)}</div></td><td class="n"><span class="tag ${b.allowed ? 'ok' : 'no'}">${b.allowed ? 'открыт' : 'закрыт'}</span></td></tr>`).join('')}</table></div></div><div class="box"><h2>Главная страница</h2><div class="tw"><table>${d.checks.map(c => `<tr><td>${esc(c.label)}<div class="muted" style="font-size:13px">${esc(c.detail)}</div></td><td class="n"><span class="tag ${c.ok ? 'ok' : 'no'}">${c.ok ? 'в порядке' : 'исправить'}</span></td></tr>`).join('')}</table></div></div></div><p class="muted" style="font-size:13.5px;margin-top:12px">Открытый доступ ботам не гарантирует, что нейросеть вас назовёт: это условие, без которого она не прочитает сайт.</p>` }
    catch (err) { out.innerHTML = `<div class="empty" style="color:var(--bad)">Не получилось проверить: ${esc(err.message)}</div>` } };
}
const app = render;
$('#dclose').onclick = closeDrawer; $('#scrim').onclick = closeDrawer;
addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer() });
addEventListener('hashchange', () => { closeDrawer(); if (st.ready && !window.onWelcome) render() });
let inSession = false; try { inSession = !!sessionStorage.getItem('korin-in') } catch (e) {}
if (st.ready) { load(); if (st.user && !data.sample && !inSession) welcome(); else render() } else onboarding();
